<svg width="1040" height="1380" viewBox="0 0 1040 1380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Union find mechanism map: path compression flattening a chain, and six variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1380" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Union Find — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 12-UNION-FIND</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">A chain of parent pointers is slow to walk. Path compression re-points every node</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">visited during a lookup straight at the root — the next lookup is instant.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">root / accepted</text>
  <rect x="220" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="242" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">rejected — already connected</text>
  <rect x="470" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="492" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">result</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">find(0) flattens the chain it walks</text>

  <rect x="32" y="266" width="976" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,286)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <text x="32" y="20" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">before find(0)</text>
    <line x1="150" y1="50" x2="288" y2="50" stroke="#4a5a70" stroke-width="1.8" marker-end="url(#arrow-ink)"></line>
    <line x1="300" y1="50" x2="438" y2="50" stroke="#4a5a70" stroke-width="1.8" marker-end="url(#arrow-ink)"></line>
    <line x1="450" y1="50" x2="578" y2="50" stroke="#4a5a70" stroke-width="1.8" marker-end="url(#arrow-ink)"></line>
    <circle cx="120" cy="50" r="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="120" y="55" fill="#14202e">0</text>
    <circle cx="300" cy="50" r="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="300" y="55" fill="#14202e">1</text>
    <circle cx="450" cy="50" r="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="450" y="55" fill="#14202e">2</text>
    <circle cx="610" cy="50" r="20" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.2"></circle>
    <text x="610" y="55" fill="#0f7a72">root</text>

    <text x="32" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a8710a">after find(0)</text>
    <path d="M138,168 Q350,220 592,178" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
    <path d="M300,168 Q420,200 592,178" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
    <line x1="450" y1="168" x2="592" y2="172" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></line>
    <circle cx="120" cy="180" r="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="120" y="185" fill="#14202e">0</text>
    <circle cx="300" cy="180" r="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="300" y="185" fill="#14202e">1</text>
    <circle cx="450" cy="180" r="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="450" y="185" fill="#14202e">2</text>
    <circle cx="610" cy="180" r="20" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.2"></circle>
    <text x="610" y="185" fill="#0f7a72">root</text>
  </g>

  <text x="32" y="594" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">One find(0) call walks 0 → 1 → 2 → root, then re-points 0, 1, and 2 all directly at the</text>
  <text x="32" y="612" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">root on its way back. The next lookup for any of them is O(1).</text>

  <text x="32" y="652" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">SIX VARIANTS</text>
  <text x="32" y="678" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One structure, six different jobs</text>

  <!-- CARD 1 -->
  <g transform="translate(32,698)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-union-find-core.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">The structure itself</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="70" y1="60" x2="70" y2="110" stroke="#0f7a72" stroke-width="1.8"></line>
      <line x1="110" y1="60" x2="70" y2="110" stroke="#0f7a72" stroke-width="1.8"></line>
      <circle cx="70" cy="120" r="18" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></circle>
      <text x="70" y="125" fill="#0f7a72">root</text>
      <circle cx="70" cy="50" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="70" y="54" fill="#14202e">0</text>
      <circle cx="110" cy="50" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="110" y="54" fill="#14202e">1</text>
      <line x1="230" y1="80" x2="230" y2="110" stroke="#a8710a" stroke-width="1.8"></line>
      <circle cx="230" cy="120" r="18" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></circle>
      <text x="230" y="125" fill="#a8710a">root</text>
      <circle cx="230" cy="70" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="230" y="74" fill="#14202e">2</text>
      <text x="160" y="165" text-anchor="middle" fill="#4a5a70">2 components, 3 total nodes</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">find + union + a running</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">component count — every other</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">variant here is this, applied.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,698)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-cycle-detection.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">union()'s return value IS the check</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="55" x2="100" y2="120" stroke="#0f7a72" stroke-width="2"></line>
      <line x1="100" y1="130" x2="215" y2="130" stroke="#0f7a72" stroke-width="2"></line>
      <line x1="225" y1="115" x2="170" y2="55" stroke="#b3467c" stroke-width="2.4" stroke-dasharray="4 3"></line>
      <circle cx="160" cy="40" r="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
      <text x="160" y="44" fill="#14202e">1</text>
      <circle cx="90" cy="130" r="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
      <text x="90" y="134" fill="#14202e">2</text>
      <circle cx="230" cy="130" r="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
      <text x="230" y="134" fill="#14202e">3</text>
      <text x="160" y="170" text-anchor="middle" fill="#b3467c">union(2,3): same root already → redundant</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Both endpoints already share a</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">root — a direct edge between them</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">closes a loop, not a new connection.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,698)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-kruskals-mst.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Sort by weight + variant 2's check</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="30" y="30" width="80" height="26" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <text x="70" y="47" fill="#0f7a72">0-2 (w=1) ✓</text>
      <rect x="30" y="64" width="80" height="26" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <text x="70" y="81" fill="#0f7a72">1-2 (w=2) ✓</text>
      <rect x="30" y="98" width="80" height="26" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="1.6"></rect>
      <text x="70" y="115" fill="#b3467c">0-1 (w=4) ✕</text>
      <rect x="30" y="132" width="80" height="26" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <text x="70" y="149" fill="#0f7a72">1-3 (w=5) ✓</text>
      <text x="220" y="90" text-anchor="middle" fill="#a8710a">total weight = 8</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Cheapest edges first; skip any</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">that would close a cycle. What</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">survives is the min spanning tree.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,1022)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-dynamic-connectivity.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Online queries, incremental count</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <g stroke="#d7dee8" stroke-width="1" fill="none">
        <rect x="30" y="30" width="30" height="30"></rect><rect x="60" y="30" width="30" height="30"></rect><rect x="90" y="30" width="30" height="30"></rect>
        <rect x="30" y="60" width="30" height="30"></rect><rect x="60" y="60" width="30" height="30"></rect><rect x="90" y="60" width="30" height="30"></rect>
        <rect x="30" y="90" width="30" height="30"></rect><rect x="60" y="90" width="30" height="30"></rect><rect x="90" y="90" width="30" height="30"></rect>
      </g>
      <rect x="30" y="30" width="30" height="30" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></rect>
      <rect x="60" y="30" width="30" height="30" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></rect>
      <rect x="90" y="60" width="30" height="30" fill="#a8710a14" stroke="#a8710a" stroke-width="1.8"></rect>
      <text x="200" y="45" fill="#4a5a70">count: 1, 1, 2, 3...</text>
      <text x="200" y="65" fill="#4a5a70">reported after EACH cell</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">+1 for new land, −1 for every</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">successful merge — no re-scan</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">of the grid needed.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,1022)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-accounts-merge.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Union-find over arbitrary keys</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">
      <text x="80" y="40" fill="#14202e">"a@x.com" → 0</text>
      <text x="80" y="60" fill="#14202e">"b@x.com" → 1</text>
      <text x="80" y="80" fill="#14202e">"c@x.com" → 2</text>
      <line x1="150" y1="50" x2="200" y2="50" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></line>
      <text x="250" y="45" fill="#0f7a72">union(0,1)</text>
      <text x="250" y="65" fill="#4a5a70">2 stays alone</text>
      <text x="160" y="130" text-anchor="middle" fill="#a8710a">group by find(): {a,b} and {c}</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Map keys to indices once, union</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">normally, then group every key</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">by its final root.</text>
  </g>

  <!-- CARD 6 -->
  <g transform="translate(712,1022)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">06-largest-island-with-flip.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Size tracked per root, hypothetical</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="60" y="40" width="50" height="50" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></rect>
      <text x="85" y="69" fill="#0f7a72">size 2</text>
      <rect x="60" y="100" width="50" height="50" fill="none" stroke="#a8710a" stroke-width="2.2" stroke-dasharray="4 3"></rect>
      <text x="85" y="129" fill="#a8710a">flip</text>
      <rect x="130" y="100" width="50" height="50" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></rect>
      <text x="155" y="129" fill="#0f7a72">size 3</text>
      <text x="220" y="65" text-anchor="middle" fill="#a8710a">2 + 3 + 1</text>
      <text x="220" y="85" text-anchor="middle" fill="#a8710a">= 6</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Sum the DISTINCT neighboring</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">islands' sizes plus one — a set</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">stops double-counting one island.</text>
  </g>

  <text x="32" y="1344" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/12-union-find/ — README.md · problems.md · 01–06*.js</text>
</svg>
