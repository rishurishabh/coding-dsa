<svg width="1040" height="1380" viewBox="0 0 1040 1380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LCS Family mechanism map: the two-sequence DP grid and six variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1380" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">LCS Family — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 21-LCS-FAMILY</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Every cell in the grid is built from at most three already-finished neighbors: diagonal,</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">directly above, and directly left.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">match — diagonal + 1</text>
  <rect x="260" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="282" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">mismatch — from above or left</text>
  <rect x="540" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="562" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">target cell</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">dp[i][j] = match ? diagonal + 1 : max(above, left)</text>

  <rect x="32" y="266" width="976" height="250" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(340,300)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="0" y="0" width="90" height="60" rx="8" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="45" y="35" fill="#0f7a72">dp[i-1][j-1]</text>
    <rect x="120" y="0" width="90" height="60" rx="8" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></rect>
    <text x="165" y="35" fill="#b3467c">dp[i-1][j]</text>
    <rect x="0" y="90" width="90" height="60" rx="8" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></rect>
    <text x="45" y="125" fill="#b3467c">dp[i][j-1]</text>
    <rect x="120" y="90" width="90" height="60" rx="8" fill="#a8710a14" stroke="#a8710a" stroke-width="2.4"></rect>
    <text x="165" y="125" fill="#a8710a">dp[i][j]</text>

    <path d="M85,55 L125,95" fill="none" stroke="#0f7a72" stroke-width="2" marker-end="url(#arrow-add)"></path>
    <path d="M165,65 L165,85" fill="none" stroke="#b3467c" stroke-width="1.8" marker-end="url(#arrow-remove)"></path>
    <path d="M95,120 L115,120" fill="none" stroke="#b3467c" stroke-width="1.8" marker-end="url(#arrow-remove)"></path>

    <text x="105" y="-18" text-anchor="middle" font-size="12" fill="#0f7a72">a[i-1] === b[j-1]: diagonal + 1</text>
    <text x="105" y="188" text-anchor="middle" font-size="12" fill="#b3467c">mismatch: max(dp[i-1][j], dp[i][j-1])</text>
  </g>

  <text x="32" y="560" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">Whether a mismatch carries the max forward, resets to 0, or costs 1 + min(three neighbors)</text>
  <text x="32" y="578" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">is the entire difference between this module's variants.</text>

  <text x="32" y="628" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">SIX VARIANTS</text>
  <text x="32" y="654" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One grid, read as a subsequence, a substring, or an edit cost</text>

  <!-- CARD 1 -->
  <g transform="translate(32,674)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-longest-common-subsequence.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Carry forward on mismatch</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">"abcde" vs "ace"</text>
      <text x="160" y="100" fill="#a8710a">shared subsequence: a·c·e</text>
      <text x="160" y="140" text-anchor="middle" fill="#4a5a70">gaps allowed on either side</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Mismatch never loses progress —</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">the better neighbor's count</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">carries through unchanged.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,674)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-longest-common-substring.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Reset to 0 on mismatch</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">"abcdxyz" vs "xyzabcd"</text>
      <text x="160" y="100" fill="#a8710a">contiguous run: a·b·c·d (len 4)</text>
      <text x="160" y="140" text-anchor="middle" fill="#4a5a70">answer = max cell, not corner cell</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">A broken run can't be patched —</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">dp[i][j] means "run ending here",</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">not "best answer so far".</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,674)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-edit-distance.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Three moves instead of two</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">"horse" → "ros"</text>
      <text x="160" y="100" fill="#a8710a">1 + min(delete, insert, replace)</text>
      <text x="160" y="140" text-anchor="middle" fill="#4a5a70">3 operations total</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Match still costs nothing — a</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">mismatch now picks the cheapest</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">of three edits, not two lookups.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,998)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-longest-increasing-subsequence-dp.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Collapse to 1D, O(n²)</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">[10,9,2,5,3,7,101,18]</text>
      <text x="160" y="100" fill="#a8710a">longest run: 2·3·7·101 (len 4)</text>
      <text x="160" y="140" text-anchor="middle" fill="#4a5a70">dp[i] = best subsequence ending at i</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">One sequence compared against</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">itself index-by-index — same</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">"anchored" framing as variant 2.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,998)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-longest-increasing-subsequence-binary-search.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Greedy + binary search, O(n log n)</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="60" y="70" width="40" height="30" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <rect x="104" y="70" width="40" height="30" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <rect x="148" y="70" width="40" height="30" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <rect x="192" y="70" width="40" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></rect>
      <text x="130" y="55" text-anchor="middle" fill="#4a5a70">tails array, length = LIS length</text>
      <text x="160" y="135" text-anchor="middle" fill="#4a5a70">not the real subsequence — just its length</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Not DP — a different technique</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">answering the same question</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">faster, when only length matters.</text>
  </g>

  <!-- CARD 6 -->
  <g transform="translate(712,998)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">06-shortest-common-supersequence-length.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Reduce to variant 1 via counting</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">len(a) + len(b) − LCS(a, b)</text>
      <path d="M160,80 L160,100" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="160" y="120" fill="#a8710a">4 + 3 − 2 = 5</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Shared characters get typed once,</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">not twice — the LCS count is all</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">that needs subtracting.</text>
  </g>

  <text x="32" y="1340" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/21-lcs-family/ — README.md · problems.md · 01–06*.js</text>
</svg>
