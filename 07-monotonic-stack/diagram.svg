<svg width="1040" height="1360" viewBox="0 0 1040 1360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Monotonic stack mechanism map: the pop-while-violating loop, and six variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1360" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Monotonic Stack — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 07-MONOTONIC-STACK</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Keep the stack sorted by popping anything the new element beats. Every variant reads</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">those pops differently — as a lookup, a pair of lookups, or a greedy build.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">about to be popped</text>
  <rect x="230" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="252" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">arriving / resolving</text>
  <rect x="410" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="432" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">result</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">A taller bar resolves every shorter one behind it</text>

  <rect x="32" y="266" width="976" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,300)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <line x1="30" y1="180" x2="700" y2="180" stroke="#d7dee8" stroke-width="1.5"></line>
    <rect x="40" y="114" width="60" height="66" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <rect x="120" y="103" width="60" height="77" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <rect x="200" y="91" width="60" height="89" fill="#b3467c14" stroke="#b3467c" stroke-width="2.2"></rect>
    <rect x="280" y="137" width="60" height="43" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <rect x="360" y="160" width="60" height="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <rect x="440" y="126" width="60" height="54" fill="#b3467c14" stroke="#b3467c" stroke-width="2.2"></rect>
    <rect x="520" y="80" width="60" height="100" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.4"></rect>
    <text x="70" y="200" fill="#4a5a70">73</text>
    <text x="150" y="200" fill="#4a5a70">74</text>
    <text x="230" y="200" fill="#b3467c">75</text>
    <text x="310" y="200" fill="#4a5a70">71</text>
    <text x="390" y="200" fill="#4a5a70">69</text>
    <text x="470" y="200" fill="#b3467c">72</text>
    <text x="550" y="200" fill="#0f7a72">76</text>
    <path d="M550,74 Q490,40 470,120" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
    <text x="500" y="30" text-anchor="middle" fill="#0f7a72">76 &gt; 72: wait = 1</text>
    <path d="M550,74 Q390,4 230,85" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
    <text x="390" y="-4" text-anchor="middle" fill="#0f7a72">76 &gt; 75: wait = 4</text>
  </g>

  <text x="32" y="590" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">76 pops both 72 and 75 in the same step — each was still waiting for a warmer day, and 76</text>
  <text x="32" y="608" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">answers both at once, at different distances.</text>

  <text x="32" y="650" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">SIX VARIANTS</text>
  <text x="32" y="676" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One pop rule, read six different ways</text>

  <!-- CARD 1 -->
  <g transform="translate(32,696)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-next-greater-element.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Decreasing stack, resolve on pop</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <line x1="20" y1="150" x2="290" y2="150" stroke="#d7dee8" stroke-width="1.4"></line>
      <rect x="60" y="70" width="50" height="80" fill="#b3467c14" stroke="#b3467c" stroke-width="2"></rect>
      <rect x="180" y="40" width="50" height="110" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.2"></rect>
      <path d="M205,34 Q140,10 100,64" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
      <text x="150" y="20" text-anchor="middle" fill="#0f7a72">resolved later, when bigger arrives</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">The popped bar's answer wasn't</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">knowable until this later, bigger</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">bar showed up.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,696)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-previous-greater-element.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Decreasing stack, resolve now</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <line x1="20" y1="150" x2="290" y2="150" stroke="#d7dee8" stroke-width="1.4"></line>
      <rect x="60" y="40" width="50" height="110" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <rect x="180" y="90" width="50" height="60" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.2"></rect>
      <path d="M180,110 Q140,90 110,80" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
      <text x="150" y="180" text-anchor="middle" fill="#0f7a72">answer known right now — no waiting</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Whatever survives on top of the</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">stack after popping IS the current</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">bar's answer, immediately.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,696)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-circular-next-greater.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Variant 1, walked around twice</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">
      <rect x="30" y="35" width="40" height="50" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></rect>
      <rect x="80" y="55" width="40" height="30" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="130" y="45" width="40" height="40" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="105" y="20" text-anchor="middle" fill="#4a5a70">lap 1 (i &lt; n): push allowed</text>
      <rect x="30" y="130" width="40" height="30" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2" stroke-dasharray="3 2"></rect>
      <rect x="80" y="135" width="40" height="25" fill="none" stroke="#d7dee8" stroke-width="1.2" stroke-dasharray="3 2"></rect>
      <rect x="130" y="140" width="40" height="20" fill="none" stroke="#d7dee8" stroke-width="1.2" stroke-dasharray="3 2"></rect>
      <text x="105" y="178" text-anchor="middle" fill="#4a5a70">lap 2 (i ≥ n): resolve only, no push</text>
      <path d="M50,128 Q40,80 50,88" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">i % n replays the array a second</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">time so wraparound candidates can</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">resolve earlier bars.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,1020)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-largest-rectangle-histogram.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Increasing stack, both sides at once</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <line x1="20" y1="150" x2="300" y2="150" stroke="#d7dee8" stroke-width="1.4"></line>
      <rect x="30" y="100" width="40" height="50" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="70" y="130" width="40" height="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="110" y="40" width="40" height="110" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="150" y="25" width="40" height="125" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="190" y="100" width="40" height="50" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="230" y="85" width="40" height="65" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="110" y="103" width="120" height="47" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></rect>
      <text x="170" y="95" text-anchor="middle" fill="#a8710a">width × shortest bar in range</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">A bar's max rectangle spans from</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">its nearest-smaller-left to its</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">nearest-smaller-right, in one pass.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,1020)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-trapping-rain-water-stack.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Decreasing stack, resolve a region</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <line x1="20" y1="150" x2="300" y2="150" stroke="#d7dee8" stroke-width="1.4"></line>
      <rect x="50" y="50" width="40" height="100" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="90" y="120" width="40" height="30" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></rect>
      <rect x="130" y="80" width="40" height="70" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="90" y="80" width="80" height="40" fill="#0f7a7214" stroke="none"></rect>
      <text x="130" y="70" text-anchor="middle" fill="#0f7a72">width × (min(walls) − floor)</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Popping the short floor bar,</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">bounded by the new bar and what's</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">exposed behind it, resolves one layer.</text>
  </g>

  <!-- CARD 6 -->
  <g transform="translate(712,1020)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">06-remove-k-digits.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Greedy stack construction</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
      <rect x="30" y="70" width="30" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <rect x="66" y="70" width="30" height="30" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8" stroke-dasharray="3 2"></rect>
      <rect x="102" y="70" width="30" height="30" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8" stroke-dasharray="3 2"></rect>
      <rect x="138" y="70" width="30" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <rect x="174" y="70" width="30" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <rect x="210" y="70" width="30" height="30" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8" stroke-dasharray="3 2"></rect>
      <rect x="246" y="70" width="30" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <text x="45" y="90" fill="#a8710a">1</text><text x="81" y="90" fill="#b3467c">4</text><text x="117" y="90" fill="#b3467c">3</text><text x="153" y="90" fill="#a8710a">2</text><text x="189" y="90" fill="#a8710a">2</text><text x="225" y="90" fill="#b3467c">1</text><text x="261" y="90" fill="#a8710a">9</text>
      <text x="150" y="130" text-anchor="middle" fill="#a8710a">kept digits form the smallest result: 1219</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">A bigger digit gets popped the</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">moment a smaller one follows it —</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">each pop spends the removal budget.</text>
  </g>

  <text x="32" y="1320" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/07-monotonic-stack/ — README.md · problems.md · 01–06*.js</text>
</svg>
