<svg width="1040" height="1360" viewBox="0 0 1040 1360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stack mechanism map: LIFO at one end, and five variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1360" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Stack — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / DATA-STRUCTURES / 01-STACK</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Push adds on top, pop removes from the top — no other position is ever touched</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">directly. That restriction is what makes both operations O(1).</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">top of stack</text>
  <rect x="200" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="222" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">push</text>
  <rect x="300" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="322" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">pop</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Push and pop, same end, every time</text>

  <rect x="32" y="266" width="976" height="260" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,296)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <rect x="330" y="184" width="100" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <text x="380" y="207" fill="#14202e">1</text>
    <rect x="330" y="144" width="100" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <text x="380" y="167" fill="#14202e">2</text>
    <rect x="330" y="104" width="100" height="36" rx="7" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></rect>
    <text x="380" y="127" fill="#a8710a">3</text>
    <text x="380" y="92" text-anchor="middle" font-size="12" fill="#a8710a">top</text>

    <path d="M300,50 Q330,70 350,100" fill="none" stroke="#0f7a72" stroke-width="2" marker-end="url(#arrow-add)"></path>
    <text x="290" y="40" text-anchor="middle" font-size="12" fill="#0f7a72">push: O(1)</text>

    <path d="M410,100 Q430,70 460,50" fill="none" stroke="#b3467c" stroke-width="2" marker-end="url(#arrow-remove)"></path>
    <text x="470" y="40" text-anchor="middle" font-size="12" fill="#b3467c">pop: O(1)</text>

    <text x="380" y="235" text-anchor="middle" font-size="12" fill="#4a5a70">no other position is ever touched directly</text>
  </g>

  <text x="32" y="560" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">Whatever was added most recently (3) is the only thing reachable — to get to 1,</text>
  <text x="32" y="578" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">everything above it has to be popped first.</text>

  <text x="32" y="618" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">FIVE FILES</text>
  <text x="32" y="644" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Two ways to build it, three problems that need it</text>

  <!-- CARD 1 -->
  <g transform="translate(32,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-array-stack.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Array-backed stack</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="60" y="80" width="44" height="34" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="82" y="102" fill="#14202e">1</text>
      <rect x="104" y="80" width="44" height="34" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="126" y="102" fill="#14202e">2</text>
      <rect x="148" y="80" width="44" height="34" rx="6" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="170" y="102" fill="#a8710a">3</text>
      <text x="170" y="65" text-anchor="middle" fill="#a8710a">data[data.length - 1]</text>
      <text x="160" y="140" text-anchor="middle" fill="#4a5a70">O(1) amortized — occasional resize</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">The array's own last index IS</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">the top — no extra bookkeeping</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">needed.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-linked-list-stack.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Linked-list-backed stack</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <circle cx="220" cy="90" r="18" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></circle>
      <text x="220" y="95" fill="#a8710a">3</text>
      <text x="220" y="60" text-anchor="middle" fill="#a8710a">head = top</text>
      <line x1="202" y1="90" x2="160" y2="90" stroke="#d7dee8" stroke-width="1.6" marker-end="url(#arrow-ink)"></line>
      <circle cx="140" cy="90" r="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="140" y="95" fill="#14202e">2</text>
      <text x="160" y="140" text-anchor="middle" fill="#4a5a70">O(1) worst case — no resizing, ever</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">New node points at the old head,</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">becomes the new head — one</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">pointer swap, guaranteed O(1).</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-valid-parentheses.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Bracket matching</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">
      <rect x="140" y="90" width="44" height="36" rx="6" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="162" y="114" fill="#a8710a">(</text>
      <text x="162" y="75" text-anchor="middle" font-size="12" fill="#a8710a">pushed, waiting</text>
      <path d="M230,108 Q260,108 260,80" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
      <text x="260" y="65" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#0f7a72">')' arrives → pop, check match</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">The next closer must match</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">whatever's on top — the most</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">recently opened bracket.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-min-stack.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">O(1) minimum tracking</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="70" y="70" width="60" height="30" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="100" y="90" fill="#14202e">main: 0</text>
      <rect x="70" y="104" width="60" height="30" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="100" y="124" fill="#14202e">main: -2</text>
      <rect x="190" y="70" width="60" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.8"></rect>
      <text x="220" y="90" fill="#a8710a">min: -2</text>
      <rect x="190" y="104" width="60" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.8"></rect>
      <text x="220" y="124" fill="#a8710a">min: -2</text>
      <text x="160" y="150" text-anchor="middle" fill="#4a5a70">pop both together — top always correct</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Every push records "the min so</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">far" — no scan needed to</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">answer getMin().</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-evaluate-rpn.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Postfix expression evaluation</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
      <rect x="80" y="70" width="44" height="34" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="102" y="92" fill="#14202e">1</text>
      <rect x="128" y="70" width="44" height="34" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="150" y="92" fill="#14202e">2</text>
      <text x="200" y="90" fill="#0f7a72">'+' arrives</text>
      <path d="M240,90 L280,90" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <rect x="280" y="70" width="30" height="34" rx="6" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="295" y="92" fill="#a8710a">3</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Pop two, combine, push the</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">result — the operator always</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">acts on the two most recent values.</text>
  </g>

  <text x="32" y="1320" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/data-structures/01-stack/ — README.md · problems.md · 01–05*.js</text>
</svg>
