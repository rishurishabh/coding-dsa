<svg width="1040" height="950" viewBox="0 0 1040 950" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Binary basics diagram: four light switches worth 8, 4, 2, and 1 points, turned on or off to spell the number 13, compared side by side with how decimal place value works.">
  <defs>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="950" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Binary Basics — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / BIT-MANIPULATION / 01-BINARY-BASICS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">A bit is one switch: OFF (0) or ON (1). Line several up, give each a point</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">value that doubles, and you can spell any whole number.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">switch ON (1)</text>
  <rect x="200" y="146" width="14" height="14" rx="3" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
  <text x="222" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">switch OFF (0)</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Same place-value idea, decimal vs. binary</text>

  <rect x="32" y="266" width="976" height="260" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <text x="60" y="300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#14202e">Decimal 345 — weights go up by ×10</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="60" y="316" width="70" height="56" rx="8" fill="#4a5a7014" stroke="#4a5a70" stroke-width="1.6"></rect>
    <text x="95" y="340" fill="#14202e">3</text>
    <text x="95" y="360" font-size="10.5" fill="#4a5a70">hundreds</text>
    <rect x="140" y="316" width="70" height="56" rx="8" fill="#4a5a7014" stroke="#4a5a70" stroke-width="1.6"></rect>
    <text x="175" y="340" fill="#14202e">4</text>
    <text x="175" y="360" font-size="10.5" fill="#4a5a70">tens</text>
    <rect x="220" y="316" width="70" height="56" rx="8" fill="#4a5a7014" stroke="#4a5a70" stroke-width="1.6"></rect>
    <text x="255" y="340" fill="#14202e">5</text>
    <text x="255" y="360" font-size="10.5" fill="#4a5a70">ones</text>
  </g>
  <text x="60" y="402" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#4a5a70">3×100 + 4×10 + 5×1 = 345</text>

  <line x1="60" y1="430" x2="480" y2="430" stroke="#d7dee8" stroke-width="1"></line>

  <text x="60" y="462" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#14202e">Binary 1101 — weights go up by ×2</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="60" y="478" width="60" height="56" rx="8" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="90" y="502" fill="#0f7a72">1</text>
    <text x="90" y="522" font-size="10.5" fill="#0f7a72">eight</text>
    <rect x="130" y="478" width="60" height="56" rx="8" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="160" y="502" fill="#0f7a72">1</text>
    <text x="160" y="522" font-size="10.5" fill="#0f7a72">four</text>
    <rect x="200" y="478" width="60" height="56" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="230" y="502" fill="#4a5a70">0</text>
    <text x="230" y="522" font-size="10.5" fill="#4a5a70">two</text>
    <rect x="270" y="478" width="60" height="56" rx="8" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="300" y="502" fill="#0f7a72">1</text>
    <text x="300" y="522" font-size="10.5" fill="#0f7a72">one</text>
  </g>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <path d="M660,320 L660,338" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
    <text x="660" y="308" fill="#14202e">8 + 4 + 0 + 1</text>
    <rect x="600" y="342" width="120" height="56" rx="10" fill="#a8710a14" stroke="#a8710a" stroke-width="2.4"></rect>
    <text x="660" y="376" fill="#a8710a" font-size="22" font-weight="700">= 13</text>
  </g>
  <text x="600" y="440" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4a5a70">Same trick, different base. Every</text>
  <text x="600" y="458" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4a5a70">tool in this track works on binary's</text>
  <text x="600" y="476" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4a5a70">columns exactly like this, one at a time.</text>

  <text x="32" y="596" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">TWO VARIANTS</text>
  <text x="32" y="622" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Converting one direction, then the other</text>

  <!-- CARD 1 -->
  <g transform="translate(32,642)">
    <rect x="0" y="0" width="460" height="270" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-decimal-to-binary.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Repeated division by 2</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">13 → remainders 1,0,1,1</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">reversed: "1101"</text>
    </g>
    <text x="16" y="220" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Each division peels off one switch's</text>
    <text x="16" y="236" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">state, starting from the smallest.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(524,642)">
    <rect x="0" y="0" width="460" height="270" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-binary-to-decimal.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Sum of place values</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">"1101" → 8+4+0+1</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">= 13</text>
    </g>
    <text x="16" y="220" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Walk the switches, add up the ones</text>
    <text x="16" y="236" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">that are turned on.</text>
  </g>

  <text x="32" y="920" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/bit-manipulation/01-binary-basics/ — README.md · problems.md · 01–02*.js</text>
</svg>
