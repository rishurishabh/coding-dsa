<svg width="1040" height="1020" viewBox="0 0 1040 1020" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bitmasking for subsets diagram: a 3-item shopping list encoded as a 3-bit number, and all 8 possible subsets listed from 000 to 111.">
  <defs>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1020" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Bitmasking for Subsets — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / BIT-MANIPULATION / 05-BITMASKING-SUBSETS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">One number's bits = one whole subset. Bit i set means "item i is in".</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Counting 0 to 2ⁿ−1 visits every possible subset, automatically.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">item included</text>
  <rect x="200" y="146" width="14" height="14" rx="3" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
  <text x="222" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">item excluded</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">A shopping list becomes one number</text>

  <rect x="32" y="266" width="976" height="270" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="80" y="300" width="130" height="56" rx="8" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="145" y="325" fill="#0f7a72">bit 0: Apple</text>
    <text x="145" y="343" fill="#0f7a72" font-weight="700">IN (1)</text>

    <rect x="230" y="300" width="130" height="56" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="295" y="325" fill="#4a5a70">bit 1: Bread</text>
    <text x="295" y="343" fill="#4a5a70" font-weight="700">OUT (0)</text>

    <rect x="380" y="300" width="130" height="56" rx="8" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="445" y="325" fill="#0f7a72">bit 2: Milk</text>
    <text x="445" y="343" fill="#0f7a72" font-weight="700">IN (1)</text>
  </g>

  <path d="M295,366 L295,394" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
  <rect x="220" y="398" width="150" height="56" rx="10" fill="#a8710a14" stroke="#a8710a" stroke-width="2.4"></rect>
  <text x="295" y="422" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#a8710a">mask = 101</text>
  <text x="295" y="440" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#a8710a">= 5</text>

  <text x="600" y="330" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">ALL 8 SUBSETS OF 3 ITEMS</text>
  <text x="600" y="356" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#4a5a70">000 {}          100 {Milk}</text>
  <text x="600" y="378" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#4a5a70">001 {Apple}     101 {Apple,Milk}</text>
  <text x="600" y="400" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#4a5a70">010 {Bread}     110 {Bread,Milk}</text>
  <text x="600" y="422" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#4a5a70">011 {Apple,Bread} 111 {Apple,Bread,Milk}</text>
  <text x="600" y="454" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">Counting 0 → 7 in order visits every one</text>
  <text x="600" y="472" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">of these exactly once — no recursion needed.</text>

  <text x="32" y="606" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">TWO VARIANTS</text>
  <text x="32" y="632" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One subset at a time, then every subset at once</text>

  <!-- CARD 1 -->
  <g transform="translate(32,652)">
    <rect x="0" y="0" width="460" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-represent-subset-as-bitmask.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Encode/decode a subset</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">{Apple,Milk} → 101</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">overlap = mask1 &amp; mask2</text>
    </g>
    <text x="16" y="250" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Checking membership or comparing</text>
    <text x="16" y="266" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">subsets fast — one operator, no loop.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(524,652)">
    <rect x="0" y="0" width="460" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-iterate-all-subsets.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Count 0 to 2ⁿ−1</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">for mask in 0..2ⁿ-1</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">all 8 subsets, no recursion</text>
    </g>
    <text x="16" y="250" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Trying EVERY possible subset — brute</text>
    <text x="16" y="266" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">force over small n.</text>
  </g>

  <text x="32" y="990" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/bit-manipulation/05-bitmasking-subsets/ — README.md · problems.md · 01–02*.js</text>
</svg>
