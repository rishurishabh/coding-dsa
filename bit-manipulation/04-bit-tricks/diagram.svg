<svg width="1040" height="980" viewBox="0 0 1040 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bit tricks diagram: four recipes for touching one bit position, check, set, clear, and toggle, each built from a mask with a single 1 bit.">
  <defs>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="980" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Bit Tricks — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / BIT-MANIPULATION / 04-BIT-TRICKS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Four recipes, all built from the same mask: 1&lt;&lt;i lights up exactly one</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">bit position and keeps every other position dark.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">the mask (1&lt;&lt;i)</text>
  <rect x="200" y="146" width="14" height="14" rx="3" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
  <text x="222" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">result</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Four recipes, one bit position, one mask</text>

  <rect x="32" y="266" width="976" height="270" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <!-- CHECK -->
  <g transform="translate(56,296)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#14202e">CHECK</text>
    <text x="0" y="24" fill="#4a5a70">(n &gt;&gt; i) &amp; 1</text>
    <rect x="0" y="40" width="200" height="150" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="16" y="66" fill="#4a5a70">slide bit i down,</text>
    <text x="16" y="84" fill="#4a5a70">read the last column</text>
    <text x="16" y="130" fill="#0f7a72" font-weight="700">n=1010, i=1</text>
    <text x="16" y="150" fill="#a8710a" font-weight="700">→ true (set)</text>
  </g>

  <!-- SET -->
  <g transform="translate(296,296)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#14202e">SET</text>
    <text x="0" y="24" fill="#4a5a70">n | (1&lt;&lt;i)</text>
    <rect x="0" y="40" width="200" height="150" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="16" y="66" fill="#4a5a70">OR forces that bit</text>
    <text x="16" y="84" fill="#4a5a70">to 1, leaves rest alone</text>
    <text x="16" y="130" fill="#0f7a72" font-weight="700">n=1010, i=2</text>
    <text x="16" y="150" fill="#a8710a" font-weight="700">→ 1110 (14)</text>
  </g>

  <!-- CLEAR -->
  <g transform="translate(536,296)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#14202e">CLEAR</text>
    <text x="0" y="24" fill="#4a5a70">n &amp; ~(1&lt;&lt;i)</text>
    <rect x="0" y="40" width="200" height="150" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="16" y="66" fill="#4a5a70">AND forces that bit</text>
    <text x="16" y="84" fill="#4a5a70">to 0, leaves rest alone</text>
    <text x="16" y="130" fill="#0f7a72" font-weight="700">n=1110, i=2</text>
    <text x="16" y="150" fill="#a8710a" font-weight="700">→ 1010 (10)</text>
  </g>

  <!-- TOGGLE -->
  <g transform="translate(776,296)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#14202e">TOGGLE</text>
    <text x="0" y="24" fill="#4a5a70">n ^ (1&lt;&lt;i)</text>
    <rect x="0" y="40" width="200" height="150" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="16" y="66" fill="#4a5a70">XOR flips that bit,</text>
    <text x="16" y="84" fill="#4a5a70">leaves rest alone</text>
    <text x="16" y="130" fill="#0f7a72" font-weight="700">n=1010, i=2</text>
    <text x="16" y="150" fill="#a8710a" font-weight="700">→ 1110 (14)</text>
  </g>

  <text x="32" y="616" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">TWO VARIANTS</text>
  <text x="32" y="642" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One bit at a time, then a whole-number shortcut</text>

  <!-- CARD 1 -->
  <g transform="translate(32,662)">
    <rect x="0" y="0" width="460" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-check-set-clear-toggle-bit.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">The four single-bit recipes</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">mask = 1 &lt;&lt; i</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">check / set / clear / toggle</text>
    </g>
    <text x="16" y="230" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Read or flip ONE specific bit</text>
    <text x="16" y="246" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">position, nothing else moves.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(524,662)">
    <rect x="0" y="0" width="460" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-power-of-two-and-bit-count.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">n &amp; (n-1) shortcuts</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">clears the lowest set bit</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">power-of-two check, bit count</text>
    </g>
    <text x="16" y="230" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">"Is this a power of two" or</text>
    <text x="16" y="246" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">"how many bits are set".</text>
  </g>

  <text x="32" y="950" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/bit-manipulation/04-bit-tricks/ — README.md · problems.md · 01–02*.js</text>
</svg>
