  <rect x="0" y="0" width="1040" height="980" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Shift Operators — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / BIT-MANIPULATION / 03-SHIFT-OPERATORS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Sliding digits left multiplies by 10 in decimal — sliding bits left</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">multiplies by 2 in binary. Same move, different base.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">bit = 1</text>
  <rect x="150" y="146" width="14" height="14" rx="3" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
  <text x="172" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">bit = 0</text>
  <rect x="270" y="146" width="14" height="14" rx="3" fill="#b3467c14" stroke="#b3467c" stroke-width="1.4"></rect>
  <text x="292" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">falls off the end</text>

