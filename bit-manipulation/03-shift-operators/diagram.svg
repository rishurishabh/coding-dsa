    <rect x="176" y="0" width="40" height="40" rx="6" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect><text x="196" y="25" fill="#0f7a72">1</text>
    <rect x="220" y="0" width="40" height="40" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect><text x="240" y="25" fill="#4a5a70">0</text>
    <rect x="264" y="0" width="40" height="40" rx="6" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect><text x="284" y="25" fill="#0f7a72">1</text>
    <rect x="308" y="0" width="40" height="40" rx="6" fill="#a8710a14" stroke="#a8710a" stroke-width="2.4"></rect><text x="328" y="25" fill="#a8710a">0</text>
  </g>
  <text x="490" y="390" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#a8710a">= 10 — a fresh 0 fills the gap on the right</text>

  <text x="60" y="450" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#14202e">20 &gt;&gt; 1 — slide right, drop the end</text>
