    <rect x="176" y="0" width="40" height="40" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect><text x="196" y="25" fill="#4a5a70">0</text>
    <rect x="220" y="0" width="40" height="40" rx="6" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect><text x="240" y="25" fill="#0f7a72">1</text>
    <rect x="264" y="0" width="40" height="40" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect><text x="284" y="25" fill="#4a5a70">0</text>
    <rect x="308" y="0" width="40" height="40" rx="6" fill="#b3467c14" stroke="#b3467c" stroke-width="2" stroke-dasharray="4,3"></rect><text x="328" y="25" fill="#b3467c">0</text>
  </g>
  <path d="M420,482 L470,482" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
