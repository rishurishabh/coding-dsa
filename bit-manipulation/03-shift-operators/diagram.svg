  <text x="490" y="536" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#a8710a">= 10 — the last bit is gone for good</text>

  <text x="32" y="606" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">TWO VARIANTS</text>
  <text x="32" y="632" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Fast ×2 and ÷2, no arithmetic required</text>

  <!-- CARD 1 -->
  <g transform="translate(32,652)">
    <rect x="0" y="0" width="460" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-left-shift.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Slide left, fill with 0</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">5 &lt;&lt; 2 doubles twice</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">= 20 (5 × 4)</text>
    </g>
    <text x="16" y="230" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">×2, ×4, ×8... without multiplying,</text>
    <text x="16" y="246" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">or building a bitmask bit by bit.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(524,652)">
    <rect x="0" y="0" width="460" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
