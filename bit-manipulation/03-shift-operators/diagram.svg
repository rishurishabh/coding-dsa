  <g transform="translate(490,316)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="0" y="0" width="40" height="40" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect><text x="20" y="25" fill="#4a5a70">0</text>
    <rect x="44" y="0" width="40" height="40" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect><text x="64" y="25" fill="#4a5a70">0</text>
    <rect x="88" y="0" width="40" height="40" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect><text x="108" y="25" fill="#4a5a70">0</text>
