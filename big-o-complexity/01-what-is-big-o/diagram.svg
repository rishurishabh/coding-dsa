<svg width="1040" height="980" viewBox="0 0 1040 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="What is Big-O diagram: a bar chart where doubling the input doubles the operation count, and a jittery timing comparison showing why Big-O counts steps instead of measuring seconds.">
  <defs>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="980" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">What is Big-O — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / BIG-O-COMPLEXITY / 01-WHAT-IS-BIG-O</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Count steps, not seconds — steps are a property of the algorithm; seconds</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">are a property of the algorithm plus the machine plus everything else running.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">operation count (stable)</text>
  <rect x="240" y="146" width="14" height="14" rx="3" fill="#b3467c14" stroke="#b3467c" stroke-width="1.4"></rect>
  <text x="262" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">wall-clock time (noisy)</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Double the input, double the operations</text>

  <rect x="32" y="266" width="976" height="270" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="90" y="446" width="70" height="30" fill="#0f7a72"></rect>
    <text x="125" y="490" fill="#4a5a70">n=10</text>
    <text x="125" y="436" fill="#0f7a72">10 ops</text>

    <rect x="230" y="416" width="70" height="60" fill="#0f7a72"></rect>
    <text x="265" y="490" fill="#4a5a70">n=20</text>
    <text x="265" y="406" fill="#0f7a72">20 ops</text>

    <rect x="370" y="356" width="70" height="120" fill="#0f7a72"></rect>
    <text x="405" y="490" fill="#4a5a70">n=40</text>
    <text x="405" y="346" fill="#0f7a72">40 ops</text>

    <rect x="510" y="296" width="70" height="180" fill="#0f7a72"></rect>
    <text x="545" y="490" fill="#4a5a70">n=80</text>
    <text x="545" y="286" fill="#0f7a72">80 ops</text>
  </g>
  <line x1="70" y1="476" x2="600" y2="476" stroke="#d7dee8" stroke-width="1.5"></line>

  <text x="700" y="330" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">MEANWHILE, ON A STOPWATCH</text>
  <text x="700" y="356" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4a5a70">Same code, same input, three runs:</text>
  <text x="700" y="382" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b3467c">run 1: 6.86 ms</text>
  <text x="700" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b3467c">run 2: 3.64 ms</text>
  <text x="700" y="426" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#b3467c">run 3: 4.00 ms</text>
  <text x="700" y="456" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">Jittery. The operation count</text>
  <text x="700" y="474" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">above never wobbles like this.</text>

  <text x="32" y="600" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">TWO VARIANTS</text>
  <text x="32" y="626" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Build the intuition, then see why it has to be this way</text>

  <!-- CARD 1 -->
  <g transform="translate(32,646)">
    <rect x="0" y="0" width="460" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-counting-operations.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Count steps, not seconds</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">operations === n, always</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">this IS what O(n) means</text>
    </g>
    <text x="16" y="230" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Building the intuition for what</text>
    <text x="16" y="246" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">"grows like n" actually means.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(524,646)">
    <rect x="0" y="0" width="460" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-why-not-just-time-it.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Timing noise, made visible</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">3 runs, 3 different times</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">seconds ≠ a property of the code</text>
    </g>
    <text x="16" y="230" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Seeing concretely why wall-clock</text>
    <text x="16" y="246" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">time is the wrong tool here.</text>
  </g>

  <text x="32" y="950" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/big-o-complexity/01-what-is-big-o/ — README.md · problems.md · 01–02*.js</text>
</svg>
