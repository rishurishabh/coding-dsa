<svg width="1040" height="1080" viewBox="0 0 1040 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Space complexity diagram: fixed memory for an in-place function versus growing memory for a copying function, and a call stack that adds one frame per recursive call versus a flat single frame for iteration.">
  <defs>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1080" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Space Complexity — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / BIG-O-COMPLEXITY / 04-SPACE-COMPLEXITY</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Same growth question as time complexity, aimed at memory instead of steps —</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">and the two of them are measured completely independently.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">O(1) — fixed</text>
  <rect x="180" y="146" width="14" height="14" rx="3" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
  <text x="202" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">O(n) — grows with input</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Fixed variables vs. growing allocation</text>

  <rect x="32" y="266" width="976" height="290" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <text x="270" y="300" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#14202e">reverseInPlace — O(1) space</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="170" y="320" width="80" height="40" rx="7" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="210" y="344" fill="#0f7a72">left</text>
    <rect x="270" y="320" width="80" height="40" rx="7" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="310" y="344" fill="#0f7a72">right</text>
  </g>
  <text x="270" y="400" text-anchor="middle" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">same 2 variables no matter</text>
  <text x="270" y="418" text-anchor="middle" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">how big the array gets</text>

  <line x1="500" y1="290" x2="500" y2="536" stroke="#d7dee8" stroke-width="1"></line>

  <text x="740" y="300" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#14202e">reverseWithCopy — O(n) space</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
    <rect x="620" y="330" width="24" height="30" fill="#a8710a"></rect>
    <rect x="650" y="320" width="24" height="40" fill="#a8710a"></rect>
    <rect x="680" y="310" width="24" height="50" fill="#a8710a"></rect>
    <rect x="710" y="300" width="24" height="60" fill="#a8710a"></rect>
    <rect x="740" y="290" width="24" height="70" fill="#a8710a"></rect>
    <rect x="770" y="280" width="24" height="80" fill="#a8710a"></rect>
    <rect x="800" y="270" width="24" height="90" fill="#a8710a"></rect>
    <rect x="830" y="260" width="24" height="100" fill="#a8710a"></rect>
  </g>
  <text x="740" y="400" text-anchor="middle" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">a full new array — memory</text>
  <text x="740" y="418" text-anchor="middle" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">grows right alongside n</text>

  <text x="32" y="500" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4a5a70">Both are O(n) TIME (touch every element once) — space complexity is a completely separate measurement.</text>
  <text x="32" y="520" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4a5a70">Recursion: one call stack frame per unfinished call — O(depth) space, real enough to crash a program.</text>

  <text x="32" y="606" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">TWO VARIANTS</text>
  <text x="32" y="632" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">In-place vs. copying, then the call stack's hidden cost</text>

  <!-- CARD 1 -->
  <g transform="translate(32,652)">
    <rect x="0" y="0" width="460" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-auxiliary-vs-input-space.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">In-place vs. copying</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">same output, same O(n) time</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">O(1) space vs O(n) space</text>
    </g>
    <text x="16" y="230" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Comparing identical time</text>
    <text x="16" y="246" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">complexity, different memory cost.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(524,652)">
    <rect x="0" y="0" width="460" height="280" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-recursive-call-stack-space.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Call stack depth</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="230" y="70" fill="#14202e">n=1,000,000 recursive calls</text>
      <path d="M230,80 L230,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="230" y="118" fill="#a8710a">RangeError: stack exceeded</text>
    </g>
    <text x="16" y="230" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Recognizing recursion's hidden</text>
    <text x="16" y="246" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">O(depth) space cost.</text>
  </g>

  <text x="32" y="1044" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/big-o-complexity/04-space-complexity/ — README.md · problems.md · 01–02*.js</text>
</svg>
