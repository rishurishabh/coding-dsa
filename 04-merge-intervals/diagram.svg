<svg width="1040" height="1360" viewBox="0 0 1040 1360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Merge intervals mechanism map: sort-then-sweep, and six variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1360" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Merge Intervals — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 04-MERGE-INTERVALS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Every variant starts with an ordering decision — sort by start or by end — that turns an</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">all-pairs comparison into a single left-to-right pass.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">kept / active</text>
  <rect x="200" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="222" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">dropped / overlap event</text>
  <rect x="430" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="452" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">result — merged / peak / gap</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Sort by start, sweep, merge</text>

  <rect x="32" y="266" width="976" height="260" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,286)">
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">
      <rect x="75" y="30" width="70" height="22" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
      <rect x="110" y="60" width="140" height="22" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
      <rect x="320" y="90" width="70" height="22" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
      <rect x="565" y="120" width="105" height="22" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
      <text x="110" y="45" text-anchor="middle" fill="#4a5a70">[1,3]</text>
      <text x="180" y="75" text-anchor="middle" fill="#4a5a70">[2,6]</text>
      <text x="355" y="105" text-anchor="middle" fill="#4a5a70">[8,10]</text>
      <text x="617" y="135" text-anchor="middle" fill="#4a5a70">[15,18]</text>
    </g>
    <line x1="380" y1="150" x2="380" y2="178" stroke="#4a5a70" stroke-width="2" marker-end="url(#arrow-ink)"></line>
    <text x="380" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#4a5a70">sort by start, sweep-merge</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="75" y="185" width="175" height="24" rx="6" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="162" y="201" fill="#a8710a">[1,6]</text>
      <rect x="320" y="185" width="70" height="24" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
      <text x="355" y="201" fill="#4a5a70">[8,10]</text>
      <rect x="565" y="185" width="105" height="24" rx="6" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
      <text x="617" y="201" fill="#4a5a70">[15,18]</text>
    </g>
  </g>

  <text x="32" y="550" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">[1,3] and [2,6] overlap (2 ≤ 3), so they collapse into [1,6]. The other two intervals</text>
  <text x="32" y="568" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">don't touch anything, so they pass through unchanged.</text>

  <text x="32" y="610" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">SIX VARIANTS</text>
  <text x="32" y="636" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Same sort-and-sweep shape, different questions</text>

  <!-- CARD 1 -->
  <g transform="translate(32,656)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-merge-overlapping.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Sort by start, sweep-merge</text>
    <g transform="translate(16,56) scale(0.9)">
      <rect x="80" y="55" width="60" height="24" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
      <rect x="120" y="85" width="80" height="24" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
      <text x="110" y="70" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#4a5a70">[2,5]</text>
      <text x="160" y="100" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#4a5a70">[4,8]</text>
      <line x1="150" y1="118" x2="150" y2="135" stroke="#4a5a70" stroke-width="1.8" marker-end="url(#arrow-ink)"></line>
      <rect x="80" y="140" width="120" height="26" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="140" y="157" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a8710a">[2,8]</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">start ≤ prev.end means overlap.</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Extend prev.end to the max, don't</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">just replace it.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,656)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-insert-interval.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Three-phase scan, no re-sort</text>
    <g transform="translate(16,56) scale(0.9)">
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">
        <rect x="34" y="70" width="14" height="20" rx="4" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
        <rect x="62" y="70" width="28" height="20" rx="4" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
        <rect x="104" y="70" width="14" height="20" rx="4" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
        <rect x="132" y="70" width="28" height="20" rx="4" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
        <rect x="188" y="70" width="56" height="20" rx="4" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      </g>
      <rect x="76" y="45" width="56" height="20" rx="4" fill="none" stroke="#b3467c" stroke-width="1.8" stroke-dasharray="3 2"></rect>
      <text x="104" y="38" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#b3467c">new: [4,8]</text>
      <text x="41" y="105" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#4a5a70">before</text>
      <text x="118" y="105" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#a8710a">overlap → merge</text>
      <text x="216" y="105" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#4a5a70">after</text>
      <line x1="160" y1="118" x2="160" y2="135" stroke="#4a5a70" stroke-width="1.6" marker-end="url(#arrow-ink)"></line>
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">
        <rect x="34" y="145" width="14" height="20" rx="4" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
        <rect x="62" y="145" width="98" height="20" rx="4" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
        <text x="111" y="159" fill="#a8710a">[3,10]</text>
        <rect x="188" y="145" width="56" height="20" rx="4" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      </g>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">No sort needed — the list was</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">already clean. Split into before /</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">overlapping / after in one pass.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,656)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-interval-intersection.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Two-pointer across two lists</text>
    <g transform="translate(16,56) scale(0.9)">
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">
        <rect x="30" y="50" width="80" height="22" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
        <text x="70" y="65" fill="#0f7a72">A: [0,4]</text>
        <rect x="150" y="50" width="80" height="22" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
        <text x="190" y="65" fill="#0f7a72">A: [6,10]</text>
        <rect x="70" y="90" width="120" height="22" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="1.6"></rect>
        <text x="130" y="105" fill="#b3467c">B: [2,8]</text>
      </g>
      <rect x="70" y="130" width="40" height="18" rx="4" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <rect x="150" y="130" width="40" height="18" rx="4" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="160" y="168" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#a8710a">[2,4] and [6,8]</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Advance whichever interval ends</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">first — it can't overlap anything</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">further ahead in the other list.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,980)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-max-overlap-sweep.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Separate start/end sweep</text>
    <g transform="translate(16,56) scale(0.9)">
      <path d="M20,150 L20,125 L60,125 L60,100 L100,100 L100,125 L140,125 L140,100 L180,100 L180,125 L260,125 L260,150"
            fill="none" stroke="#14202e" stroke-width="2.2"></path>
      <line x1="20" y1="100" x2="260" y2="100" stroke="#a8710a" stroke-width="1.6" stroke-dasharray="4 3"></line>
      <text x="240" y="92" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#a8710a">peak = 2 rooms</text>
      <text x="20" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#0f7a72">+1 at each start</text>
      <text x="180" y="180" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#b3467c">−1 at each end</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Sort starts and ends separately;</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">sweep both. The running total's</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">peak is the answer.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,980)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-greedy-non-overlapping.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Sort by END, greedy keep/drop</text>
    <g transform="translate(16,56) scale(0.9)">
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">
        <rect x="80" y="40" width="50" height="22" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
        <text x="105" y="55" fill="#0f7a72">[1,2] ✓</text>
        <rect x="130" y="70" width="50" height="22" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
        <text x="155" y="85" fill="#0f7a72">[2,3] ✓</text>
        <rect x="80" y="100" width="100" height="22" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="1.6" stroke-dasharray="3 2"></rect>
        <text x="130" y="115" fill="#b3467c">[1,3] ✕</text>
        <rect x="180" y="130" width="50" height="22" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
        <text x="205" y="145" fill="#0f7a72">[3,4] ✓</text>
      </g>
      <text x="160" y="170" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">processed in end-time order</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Sorted by end, keeping the</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">soonest-finishing interval leaves</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">the most room for what's next.</text>
  </g>

  <!-- CARD 6 -->
  <g transform="translate(712,980)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">06-free-time-gaps.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Merge, then read the complement</text>
    <g transform="translate(16,56) scale(0.9)">
      <rect x="55" y="80" width="50" height="26" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></rect>
      <text x="80" y="98" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#0f7a72">[1,3]</text>
      <rect x="105" y="80" width="25" height="26" rx="4" fill="#a8710a14" stroke="#a8710a" stroke-width="2" stroke-dasharray="3 2"></rect>
      <rect x="130" y="80" width="150" height="26" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></rect>
      <text x="205" y="98" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#0f7a72">[4,10]</text>
      <text x="117" y="70" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#a8710a">free: [3,4]</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Merge every schedule into the</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">true busy periods first — what's</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">between two of them is free.</text>
  </g>

  <text x="32" y="1320" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/04-merge-intervals/ — README.md · problems.md · 01–06*.js</text>
</svg>
