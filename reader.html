  :root[data-theme="dark"] {
    --ink: #e7ecf3; --ink-soft: #94a3b8; --paper: #0b0f16; --surface: #131a24; --line: #232d3b;

  .font-mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace; }
  .font-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  body { margin: 0; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }

  #doc h2 { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 20px; line-height: 1.3; margin: 36px 0 12px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink); }

  #doc pre { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0 0 16px; }
  #doc pre code { background: none; border: none; padding: 0; font-size: 13px; line-height: 1.6; }

  /* Standalone .js file viewer (reader.html?path=...js) — a minimal

     the repo's no-dependency convention. */
  .code-view { counter-reset: line; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 0; overflow-x: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.65; margin: 0 0 20px; }
  .code-view .code-line { counter-increment: line; white-space: pre; padding: 0 20px 0 4.4em; position: relative; color: var(--ink); }
  .code-view .code-line::before { content: counter(line); position: absolute; left: 0; width: 3.6em; text-align: right; color: var(--ink-soft); opacity: 0.45; user-select: none; }
  .code-view .code-line:hover { background: var(--paper); }
  .tok-comment { color: var(--ink-soft); font-style: italic; }
  .tok-string { color: var(--result); }
  .tok-keyword { color: var(--add); font-weight: 600; }

  #doc a { text-decoration: underline; text-decoration-style: dotted; }

  /* diagram.svg files use fixed light-theme colors (so they render consistently

  :root[data-theme="dark"] #doc img { filter: brightness(0.88) contrast(1.03); }
  #doc table { width: 100%; border-collapse: collapse; margin: 0 0 20px; font-size: 14px; }
  #doc th, #doc td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  #doc th { background: var(--surface); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); }
  #doc td { color: var(--ink-soft); }
  #doc td code, #doc th code { white-space: nowrap; }

  #progress-bar { position: fixed; top: 0; left: 0; height: 3px; width: 0%; background: var(--add); z-index: 50; }

  #toc { position: fixed; top: 110px; right: max(24px, calc(50% - 620px)); width: 220px; display: none; max-height: calc(100vh - 150px); overflow-y: auto; }
  @media (min-width: 1360px) { #toc.has-content { display: block; } }
  #toc .toc-title { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin: 0 0 10px; }
  #toc a { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.5; padding: 5px 0 5px 12px; border-left: 2px solid var(--line); color: var(--ink-soft); text-decoration: none; transition: color 0.15s, border-color 0.15s; }
  #toc a:hover { color: var(--ink); }
  #toc a.active { color: var(--add); border-left-color: var(--add); font-weight: 600; }

  /* Quick-glance notes: an auto-pulled one-line summary of each page's first
     three sections (What / When to use it / Why it works), pinned to a left
     sidebar — mirrors #toc on the right. Flat callout style, not literal
     "paper" notes — color-coded left border is the only accent. */
  .sticky-notes { position: fixed; top: 110px; left: max(24px, calc(50% - 620px)); width: 224px; display: none; flex-direction: column; gap: 14px; max-height: calc(100vh - 150px); overflow-y: auto; padding: 2px; }
  @media (min-width: 1360px) { .sticky-notes.has-content { display: flex; } }
  .sticky-note { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); border-left-width: 3px; background: var(--surface); }
  .sticky-note .note-title { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 5px; }
  .sticky-note .note-body { font-size: 11px; line-height: 1.7; margin: 0; color: var(--ink-soft); }
  .sticky-note .note-body code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 3px; padding: 0.1em 0.35em; color: var(--ink); }
  .sticky-note .note-body a { color: var(--ink-soft); text-decoration: underline; text-decoration-style: dotted; }
  .sticky-note .note-body a:hover { color: var(--ink); }
  .note-add { border-left-color: var(--add); }
  .note-add .note-title { color: var(--add); }
  .note-remove { border-left-color: var(--remove); }
  .note-remove .note-title { color: var(--remove); }
  .note-result { border-left-color: var(--result); }
  .note-result .note-title { color: var(--result); }
</style>

<script>
  function resolvePath(baseDir, relative) {
    if (/^https?:\/\//i.test(relative) || relative.startsWith('#')) return relative;
    const combined = (baseDir + relative).split('/');
    const stack = [];
    for (const part of combined) {
      if (part === '' || part === '.') continue;
      if (part === '..') stack.pop();
      else stack.push(part);
    }
    return stack.join('/');
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function slugify(text) {
    return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function setPageMeta(title, description, path) {
    const fullTitle = title + ' — coding_dsa';
    const desc = description.length > 160 ? description.slice(0, 157).trim() + '...' : description;
    const url = 'https://rishurishabh.github.io/coding-dsa/reader.html?path=' + path;
    document.title = fullTitle;
    const setContent = (selector, value) => {
      const el = document.querySelector(selector);
      if (el) el.setAttribute('content', value);
    };
    setContent('meta[name="description"]', desc);
    setContent('meta[property="og:title"]', fullTitle);
    setContent('meta[property="og:description"]', desc);
    setContent('meta[property="og:url"]', url);
    setContent('meta[name="twitter:title"]', fullTitle);
    setContent('meta[name="twitter:description"]', desc);
  }

  const JS_KEYWORDS = /\b(?:function|const|let|var|if|else|for|while|do|return|class|new|this|typeof|instanceof|throw|try|catch|finally|break|continue|switch|case|default|extends|super|import|export|from|require|module|exports|async|await|yield|static|get|set|of|in|null|undefined|true|false|void|delete)\b/;

  function highlightJS(code) {
    const escaped = escapeHtml(code);
    const pattern = new RegExp(
      '(//.*$)' +                              // 1: line comment
      '|(/\\*[\\s\\S]*?\\*/)' +                 // 2: block comment
      '|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\'|`(?:[^`\\\\]|\\\\.)*`)' + // 3: string
      '|(' + JS_KEYWORDS.source + ')' +         // 4: keyword
      '|(\\b\\d+\\.?\\d*\\b)',                  // 5: number
      'gm'
    );
    return escaped.replace(pattern, (m, comment, block, str, keyword, num) => {
      if (comment || block) return '<span class="tok-comment">' + m + '</span>';
      if (str) return '<span class="tok-string">' + m + '</span>';
      if (keyword) return '<span class="tok-keyword">' + m + '</span>';
      if (num) return '<span class="tok-number">' + m + '</span>';
      return m;
    });
  }

  function renderCodeView(code) {
    const highlighted = highlightJS(code);
    const lines = highlighted.split('\n').map((line) => '<div class="code-line">' + (line.length ? line : ' ') + '</div>');
    return '<div class="code-view">' + lines.join('') + '</div>';
  }

  function inline(text, baseDir) {
    let out = escapeHtml(text);
    out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, alt, src) => {
      const resolved = resolvePath(baseDir, src);
      return '<img alt="' + alt + '" src="' + resolved + '">';
    });
    out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => {
      let resolved = resolvePath(baseDir, href);
      if (/\.(md|js)($|#)/i.test(resolved)) resolved = 'reader.html?path=' + resolved;
      return '<a href="' + resolved + '">' + label + '</a>';
    });
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    return out;
  }

  function renderMarkdown(md, baseDir) {
    const lines = md.replace(/\r\n/g, '\n').split('\n');
    let html = '';
    let i = 0;

    function isTableSep(line) {
      return /^\s*\|?[\s:|-]+\|?\s*$/.test(line) && line.includes('-');
    }

    while (i < lines.length) {
      const line = lines[i];

      if (line.trim() === '') { i++; continue; }

      // fenced code block
      if (line.trim().startsWith('```')) {
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith('```')) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        html += '<pre><code>' + escapeHtml(buf.join('\n')) + '</code></pre>';
        continue;
      }

      // headers
      const headerMatch = line.match(/^(#{1,6})\s+(.*)$/);
      if (headerMatch) {
        const level = headerMatch[1].length;
        const idAttr = level === 2 ? ' id="' + slugify(headerMatch[2]) + '"' : '';
        html += '<h' + level + idAttr + '>' + inline(headerMatch[2], baseDir) + '</h' + level + '>';
        i++;
        continue;
      }

      // table
      if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        const headerCells = line.split('|').map(c => c.trim()).filter((c, idx, arr) => !(idx === 0 && c === '') && !(idx === arr.length - 1 && c === ''));
        i += 2;
        const rows = [];
        while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') {
          const cells = lines[i].split('|').map(c => c.trim()).filter((c, idx, arr) => !(idx === 0 && c === '') && !(idx === arr.length - 1 && c === ''));
          rows.push(cells);
          i++;
        }
        html += '<table><thead><tr>' + headerCells.map(c => '<th>' + inline(c, baseDir) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map(r => '<tr>' + r.map(c => '<td>' + inline(c, baseDir) + '</td>').join('') + '</tr>').join('') +
          '</tbody></table>';
        continue;
      }

      // lists (unordered - / ordered N.)
      if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
        const ordered = /^\s*\d+\./.test(line);
        const tag = ordered ? 'ol' : 'ul';
        const items = [];
        while (i < lines.length) {
          const m = lines[i].match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
          if (m) {
            items.push(m[1]);
            i++;
          } else if (lines[i].trim() !== '' && /^\s+\S/.test(lines[i]) && items.length > 0) {
            items[items.length - 1] += ' ' + lines[i].trim();
            i++;
          } else {
            break;
          }
        }
        html += '<' + tag + '>' + items.map(it => '<li>' + inline(it, baseDir) + '</li>').join('') + '</' + tag + '>';
        continue;
      }

      // paragraph
      const buf = [line];
      i++;
      while (i < lines.length && lines[i].trim() !== '' && !/^(#{1,6})\s/.test(lines[i]) && !lines[i].trim().startsWith('```') && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        buf.push(lines[i]);
        i++;
      }
      html += '<p>' + inline(buf.join(' '), baseDir) + '</p>';
    }
    return html;
  }

  function setupProgressBar() {
    const bar = document.getElementById('progress-bar');
    function update() {
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      const pct = scrollable > 0 ? Math.min(100, (window.scrollY / scrollable) * 100) : 0;
      bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  }

  function buildTOC(docEl) {
    const tocEl = document.getElementById('toc');
    const headers = Array.from(docEl.querySelectorAll('h2'));
    if (headers.length < 2) return; // not worth a nav for a short page

    tocEl.innerHTML = '<p class="toc-title">On this page</p>' +
      headers.map((h) => '<a href="#' + h.id + '" data-target="' + h.id + '">' + h.textContent + '</a>').join('');
    tocEl.classList.add('has-content');

    const links = tocEl.querySelectorAll('a');
    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        links.forEach((l) => l.classList.remove('active'));
        const active = tocEl.querySelector('a[data-target="' + entry.target.id + '"]');
        if (active) active.classList.add('active');
      }
    }, { rootMargin: '-15% 0px -70% 0px' });
    headers.forEach((h) => observer.observe(h));
  }

  function buildStickyNotes(docEl, currentPath) {
    // Complexity cheatsheet: every distinct Big-O notation mentioned on the
    // page (plain text, not just inside code spans — most of these READMEs
    // write "O(1)" as prose, not `O(1)`), in the order it first appears.
    const complexities = [];
    const bigOMatches = docEl.textContent.match(/O\([^)]{1,12}\)/g);
    if (bigOMatches) bigOMatches.forEach((c) => { if (!complexities.includes(c)) complexities.push(c); });

    // File index: every variant .js file linked from the page's table, so
    // you can jump straight to a specific implementation.
    const files = [];
    docEl.querySelectorAll('a[href$=".js"]').forEach((a) => {
      const href = a.getAttribute('href');
      if (!files.some((f) => f.href === href)) files.push({ label: a.textContent.trim(), href });
    });

    // Related modules: other README.md pages this one links to (cross-
    // references like "see also X" or "not the same as Y").
    const related = [];
    docEl.querySelectorAll('a[href*="reader.html?path="]').forEach((a) => {
      const href = a.getAttribute('href');
      const target = decodeURIComponent(href.split('reader.html?path=')[1] || '');
      if (target.endsWith('README.md') && target !== currentPath && !related.some((r) => r.href === href)) {
        related.push({ label: a.textContent.trim(), href });
      }
    });

    const notes = [];
    if (complexities.length > 0) {
      notes.push({
        title: 'Complexity', color: 'add',
        bodyHtml: complexities.slice(0, 8).map((c) => '<code>' + c + '</code>').join(' · '),
      });
    }
    if (files.length > 1) {
      notes.push({
        title: 'Files (' + files.length + ')', color: 'remove',
        bodyHtml: files.slice(0, 9).map((f) => '<a href="' + f.href + '">' + f.label + '</a>').join('<br>'),
      });
    }
    if (related.length > 0) {
      notes.push({
        title: 'Related', color: 'result',
        bodyHtml: related.slice(0, 5).map((r) => '<a href="' + r.href + '">' + r.label + '</a>').join('<br>'),
      });
    }

    if (notes.length === 0) return;

    const wrap = document.createElement('div');
    wrap.className = 'sticky-notes has-content';
    wrap.innerHTML = notes.map((n) =>
      '<div class="sticky-note note-' + n.color + '">' +
        '<p class="note-title">' + n.title + '</p>' +
        '<p class="note-body">' + n.bodyHtml + '</p>' +
      '</div>'
    ).join('');

    const h1 = docEl.querySelector('h1');
    if (h1) h1.after(wrap);
    else docEl.prepend(wrap);
  }

  async function main() {
    const params = new URLSearchParams(location.search);
    const path = params.get('path');
    const statusEl = document.getElementById('status');
    const docEl = document.getElementById('doc');
    const cardEl = document.getElementById('card');
    const breadcrumbEl = document.getElementById('breadcrumb');

    if (!path) {
      statusEl.textContent = 'No ?path= given.';
      return;
    }

    document.title = path + ' — coding_dsa';
    breadcrumbEl.textContent = 'coding_dsa / ' + path;
    const baseDir = path.includes('/') ? path.slice(0, path.lastIndexOf('/') + 1) : '';

    statusEl.innerHTML = '<span class="inline-flex items-center gap-2"><span class="h-1.5 w-1.5 animate-pulse rounded-full bg-[var(--add)]"></span>Loading…</span>';

    const isCode = /\.js$/i.test(path);

    try {
      const res = await fetch(path);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      statusEl.textContent = '';
      let pageTitle = path;
      let pageDescription = 'coding_dsa — pattern-based DSA practice in JavaScript.';
      if (isCode) {
        const filename = path.split('/').pop();
        docEl.innerHTML = '<h1>' + filename + '</h1>' + renderCodeView(text);
        pageTitle = filename;
        pageDescription = 'Runnable source for ' + filename + ' — part of the coding_dsa pattern-based DSA course. ' + path;
      } else {
        docEl.innerHTML = renderMarkdown(text, baseDir);
        // Read title/description BEFORE inserting sticky notes — those add
        // their own <p> tags, which would otherwise get picked up instead
        // of the page's real first paragraph.
        const h1 = docEl.querySelector('h1');
        const firstP = docEl.querySelector('p');
        pageTitle = h1 ? h1.textContent : path;
        pageDescription = firstP ? firstP.textContent : pageDescription;
        buildTOC(docEl);
        buildStickyNotes(docEl, path);
      }
      cardEl.classList.remove('hidden');
      setPageMeta(pageTitle, pageDescription, path);
    } catch (err) {
      statusEl.innerHTML =
        '<div class="rounded-2xl border border-[var(--line)] bg-[var(--surface)] p-6 max-w-[70ch] shadow-sm">' +
        '<p class="mb-3 text-[var(--ink)]">Could not load <code class="font-mono bg-[var(--paper)] border border-[var(--line)] rounded px-1.5 py-0.5">' + path + '</code> directly (' + err.message + ').</p>' +
        '<p class="mb-3">Browsers block this kind of local file fetch — open this page from the live site instead:<br>' +
        '<a class="underline decoration-dotted hover:text-[var(--ink)]" href="https://rishurishabh.github.io/coding-dsa/reader.html?path=' + encodeURIComponent(path) + '">rishurishabh.github.io/coding-dsa/reader.html?path=' + path + '</a></p>' +
        '<p>Or view it rendered on GitHub directly:<br>' +
