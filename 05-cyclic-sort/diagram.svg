<svg width="1040" height="1400" viewBox="0 0 1040 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cyclic sort mechanism map: the placement swap loop, and six variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1400" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Cyclic Sort — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 05-CYCLIC-SORT</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Every value knows its own home index without comparing to anything else. Swap it there</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">directly; whatever's left in the wrong seat afterward tells you what's missing or duplicated.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">wrong home / duplicate</text>
  <rect x="240" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="262" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">swap target</text>
  <rect x="380" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="402" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">correctly seated / result</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Swap into place, don't compare</text>

  <rect x="32" y="266" width="976" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,310)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">
    <rect x="206" y="30" width="60" height="44" rx="7" fill="#b3467c14" stroke="#b3467c" stroke-width="2"></rect>
    <rect x="278" y="30" width="60" height="44" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <rect x="350" y="30" width="60" height="44" rx="7" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <rect x="422" y="30" width="60" height="44" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <rect x="494" y="30" width="60" height="44" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="236" y="58" fill="#b3467c">3</text>
    <text x="308" y="58" fill="#14202e">1</text>
    <text x="380" y="58" fill="#0f7a72">5</text>
    <text x="452" y="58" fill="#14202e">4</text>
    <text x="524" y="58" fill="#14202e">2</text>
    <path d="M236,26 Q308,-6 380,26" fill="none" stroke="#4a5a70" stroke-width="1.8" marker-end="url(#arrow-ink)"></path>
    <text x="308" y="-10" text-anchor="middle" font-size="12" fill="#4a5a70">swap: 3's home is index 2</text>
    <rect x="206" y="140" width="60" height="44" rx="7" fill="#b3467c14" stroke="#b3467c" stroke-width="2"></rect>
    <rect x="278" y="140" width="60" height="44" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <rect x="350" y="140" width="60" height="44" rx="7" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></rect>
    <rect x="422" y="140" width="60" height="44" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <rect x="494" y="140" width="60" height="44" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="236" y="168" fill="#b3467c">5</text>
    <text x="308" y="168" fill="#14202e">1</text>
    <text x="380" y="168" fill="#a8710a">3</text>
    <text x="452" y="168" fill="#14202e">4</text>
    <text x="524" y="168" fill="#14202e">2</text>
  </g>

  <text x="32" y="600" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">Index 2 now correctly holds 3 for good — it's never touched again. Index 0 holds 5 now,</text>
  <text x="32" y="618" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">which still isn't home, so it swaps again on the next step.</text>

  <text x="32" y="660" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">SIX VARIANTS</text>
  <text x="32" y="686" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One swap loop, five ways to read the leftovers</text>

  <!-- CARD 1 -->
  <g transform="translate(32,706)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-basic-placement.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">The placement loop itself</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
      <rect x="40" y="35" width="40" height="34" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="84" y="35" width="40" height="34" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="128" y="35" width="40" height="34" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="172" y="35" width="40" height="34" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="216" y="35" width="40" height="34" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="60" y="57" fill="#14202e">3</text>
      <text x="104" y="57" fill="#14202e">1</text>
      <text x="148" y="57" fill="#14202e">5</text>
      <text x="192" y="57" fill="#14202e">4</text>
      <text x="236" y="57" fill="#14202e">2</text>
      <line x1="148" y1="80" x2="148" y2="100" stroke="#4a5a70" stroke-width="1.8" marker-end="url(#arrow-ink)"></line>
      <text x="148" y="94" text-anchor="middle" font-size="10.5" fill="#4a5a70">at most n swaps</text>
      <rect x="40" y="110" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <rect x="84" y="110" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <rect x="128" y="110" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <rect x="172" y="110" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <rect x="216" y="110" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="60" y="132" fill="#a8710a">1</text>
      <text x="104" y="132" fill="#a8710a">2</text>
      <text x="148" y="132" fill="#a8710a">3</text>
      <text x="192" y="132" fill="#a8710a">4</text>
      <text x="236" y="132" fill="#a8710a">5</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Each swap seats one value</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">permanently. No comparisons —</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">v always goes straight to index v−1.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,706)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-find-missing-number.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">First mismatch</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
      <rect x="100" y="80" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <rect x="144" y="80" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <rect x="188" y="80" width="40" height="34" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="2.2"></rect>
      <text x="120" y="102" fill="#a8710a">0</text>
      <text x="164" y="102" fill="#a8710a">1</text>
      <text x="208" y="102" fill="#b3467c">3</text>
      <text x="120" y="70" fill="#4a5a70" font-size="11">idx0</text>
      <text x="164" y="70" fill="#4a5a70" font-size="11">idx1</text>
      <text x="208" y="70" fill="#4a5a70" font-size="11">idx2</text>
      <text x="160" y="140" text-anchor="middle" fill="#b3467c" font-size="12">index 2 ≠ value 2 → missing = 2</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">After placement, the one index</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">not holding its own value points</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">straight at the missing number.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,706)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-find-all-missing.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Every mismatch, missing side</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="30" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <rect x="68" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <rect x="106" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <rect x="144" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <rect x="182" y="80" width="34" height="30" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="2"></rect>
      <rect x="220" y="80" width="34" height="30" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="2"></rect>
      <rect x="258" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <text x="47" y="100" fill="#a8710a">1</text>
      <text x="85" y="100" fill="#a8710a">2</text>
      <text x="123" y="100" fill="#a8710a">3</text>
      <text x="161" y="100" fill="#a8710a">4</text>
      <text x="199" y="100" fill="#b3467c">3</text>
      <text x="237" y="100" fill="#b3467c">2</text>
      <text x="275" y="100" fill="#a8710a">8</text>
      <text x="215" y="135" text-anchor="middle" fill="#b3467c" font-size="11">indices 5,6 wrong → missing 5, 6</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">A duplicate squatting on another</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">value's home shows up as a</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">mismatch at that missing index too.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,1030)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-find-duplicates.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Every mismatch, duplicate side</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="30" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <rect x="68" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <rect x="106" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <rect x="144" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <rect x="182" y="80" width="34" height="30" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
      <rect x="220" y="80" width="34" height="30" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
      <rect x="258" y="80" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.4"></rect>
      <text x="47" y="100" fill="#a8710a">1</text>
      <text x="85" y="100" fill="#a8710a">2</text>
      <text x="123" y="100" fill="#a8710a">3</text>
      <text x="161" y="100" fill="#a8710a">4</text>
      <text x="199" y="100" fill="#0f7a72">3</text>
      <text x="237" y="100" fill="#0f7a72">2</text>
      <text x="275" y="100" fill="#a8710a">8</text>
      <text x="215" y="135" text-anchor="middle" fill="#0f7a72" font-size="11">the VALUES there are the duplicates: 3, 2</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Same leftover cells as variant 3 —</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">read as "this value has no home"</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">instead of "this index has no value".</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,1030)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-corrupt-pair.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">One mismatch, two answers</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
      <rect x="60" y="70" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <rect x="104" y="70" width="40" height="34" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="2.4"></rect>
      <rect x="148" y="70" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <text x="80" y="92" fill="#a8710a">1</text>
      <text x="124" y="92" fill="#b3467c">2</text>
      <text x="168" y="92" fill="#a8710a">4</text>
      <path d="M124,60 Q124,20 90,20" fill="none" stroke="#b3467c" stroke-width="1.6" marker-end="url(#arrow-remove)"></path>
      <text x="70" y="16" text-anchor="middle" font-size="11" fill="#b3467c">duplicate = 2</text>
      <path d="M124,60 Q124,20 165,20" fill="none" stroke="#a8710a" stroke-width="1.6" marker-end="url(#arrow-result)"></path>
      <text x="185" y="16" text-anchor="middle" font-size="11" fill="#a8710a">missing = idx+1 = 3</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Value AND index of the same cell</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">each answer a different question —</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">no second pass needed.</text>
  </g>

  <!-- CARD 6 -->
  <g transform="translate(712,1030)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">06-first-missing-positive.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Placement with a range guard</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
      <rect x="40" y="80" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <rect x="84" y="80" width="40" height="34" rx="5" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
      <rect x="128" y="80" width="40" height="34" rx="5" fill="none" stroke="#4a5a70" stroke-width="1.6" stroke-dasharray="3 2"></rect>
      <rect x="172" y="80" width="40" height="34" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="1.6"></rect>
      <text x="60" y="102" fill="#a8710a">1</text>
      <text x="104" y="102" fill="#14202e">4</text>
      <text x="148" y="102" fill="#4a5a70">−1</text>
      <text x="192" y="102" fill="#a8710a">3</text>
      <text x="148" y="132" text-anchor="middle" font-size="10" fill="#4a5a70">out of range, never swapped</text>
      <text x="126" y="150" text-anchor="middle" font-size="11" fill="#b3467c">index 1 mismatched → answer = 2</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">The swap condition adds a range</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">check — values that could never be</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">the answer are skipped, not placed.</text>
  </g>

  <text x="32" y="1360" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/05-cyclic-sort/ — README.md · problems.md · 01–06*.js</text>
</svg>
