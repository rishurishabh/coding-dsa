<svg width="1040" height="1380" viewBox="0 0 1040 1380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Greedy mechanism map: one irreversible local choice per step, and five variant diagrams each with a different correctness argument.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1380" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Greedy — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 24-GREEDY</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">One choice per step, made once, never revisited — no table of subproblems,</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">just a proof that the local rule can't lose to any alternative.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#4a5a70"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">candidate</text>
  <rect x="180" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="202" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">greedy pick</text>
  <rect x="330" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="352" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">discarded, for good</text>
  <rect x="520" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="542" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">committed result</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Pick once, commit, never look back</text>

  <rect x="32" y="266" width="976" height="250" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(220,310)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="0" y="0" width="110" height="52" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <text x="55" y="31" fill="#4a5a70">candidate A</text>
    <rect x="140" y="0" width="110" height="52" rx="8" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.4"></rect>
    <text x="195" y="31" fill="#0f7a72">candidate B ★</text>
    <rect x="280" y="0" width="110" height="52" rx="8" fill="#b3467c14" stroke="#b3467c" stroke-width="1.6" stroke-dasharray="4,3"></rect>
    <text x="335" y="31" fill="#b3467c">candidate C</text>

    <text x="55" y="86" font-size="11.5" fill="#4a5a70">loses the</text>
    <text x="55" y="100" font-size="11.5" fill="#4a5a70">exchange</text>
    <text x="335" y="86" font-size="11.5" fill="#b3467c">disqualified —</text>
    <text x="335" y="100" font-size="11.5" fill="#b3467c">never revisited</text>

    <path d="M195,58 L195,90" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
    <rect x="120" y="126" width="150" height="52" rx="8" fill="#a8710a14" stroke="#a8710a" stroke-width="2.4"></rect>
    <text x="195" y="157" fill="#a8710a">committed choice</text>
  </g>

  <text x="620" y="330" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">WHY IT'S SAFE — one of four arguments</text>
  <text x="620" y="356" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">Swapping the greedy pick for any other</text>
  <text x="620" y="376" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">candidate never improves the outcome —</text>
  <text x="620" y="396" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">an exchange argument (v1), a feasibility</text>
  <text x="620" y="416" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">invariant (v2, v3), a disqualify-the-stretch</text>
  <text x="620" y="436" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">invariant (v4), or two passes combined via</text>
  <text x="620" y="456" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">max (v5). No proof, no greedy — it's just a</text>
  <text x="620" y="476" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">guess that happens to pass a few cases.</text>

  <text x="32" y="560" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">Contrast with DP (19–23): no table of subproblem answers is ever built —</text>
  <text x="32" y="578" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">just one running choice, made irreversibly, at each step.</text>

  <text x="32" y="618" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">FIVE VARIANTS</text>
  <text x="32" y="644" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Same "commit and move on," five different safety proofs</text>

  <!-- CARD 1 -->
  <g transform="translate(32,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-non-overlapping-intervals.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Sort by end, exchange argument</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">keep earliest-ending interval</text>
      <path d="M160,80 L160,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="160" y="118" fill="#a8710a">min removals: 1</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Swapping any kept interval</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">for the earliest ender never</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">costs more room downstream.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-jump-game.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Farthest-reach feasibility</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">farthest = max(farthest, i+nums[i])</text>
      <path d="M160,80 L160,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="160" y="118" fill="#a8710a">reachable: true</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">One running number replaces</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">every earlier choice — if it</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">falls behind i, nothing saves it.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-jump-game-ii.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Boundary expansion (BFS levels)</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">i === currentEnd → jumps++</text>
      <path d="M160,80 L160,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="160" y="118" fill="#a8710a">min jumps: 2</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Same idea as variant 2, plus a</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">second boundary — one level</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">of BFS per committed jump.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-gas-station.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Running deficit, reset point</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">tank &lt; 0 → start = i+1, reset</text>
      <path d="M160,80 L160,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="160" y="118" fill="#a8710a">valid start: index 3</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">A failed stretch disqualifies</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">every start inside it at once,</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">not just the one that broke it.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-candy.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Two-pass, combine via max</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">max(leftPass[i], rightPass[i])</text>
      <path d="M160,80 L160,98" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="160" y="118" fill="#a8710a">min total candies: 5</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Neither one-directional pass</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">satisfies both neighbors — the</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">max of both passes does.</text>
  </g>

  <text x="32" y="1340" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/24-greedy/ — README.md · problems.md · 01–05*.js</text>
</svg>
