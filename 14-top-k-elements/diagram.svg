<svg width="1040" height="1380" viewBox="0 0 1040 1380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top K elements mechanism map: the fixed-size heap eviction loop, and five variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1380" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Top K Elements — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 14-TOP-K-ELEMENTS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">A heap capped at size K. Every new arrival gets pushed in; if that tips the heap past</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">K, whatever's worst gets popped right back out.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">evicted — not in the top K</text>
  <rect x="270" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="292" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">arriving</text>
  <rect x="400" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="422" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">current top K</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Push, then pop if oversized</text>

  <rect x="32" y="266" width="976" height="260" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,296)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" text-anchor="middle">
    <rect x="140" y="40" width="60" height="44" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <text x="170" y="68" fill="#14202e">3</text>
    <rect x="212" y="40" width="60" height="44" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <text x="242" y="68" fill="#14202e">5</text>
    <rect x="284" y="40" width="60" height="44" rx="8" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <text x="314" y="68" fill="#14202e">4</text>
    <rect x="420" y="40" width="60" height="44" rx="8" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2" stroke-dasharray="4 3"></rect>
    <text x="450" y="68" fill="#0f7a72">7</text>
    <text x="450" y="28" text-anchor="middle" font-size="12" fill="#0f7a72">arriving: push</text>
    <path d="M420,62 Q380,62 344,62" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>

    <path d="M170,88 Q170,120 100,150" fill="none" stroke="#b3467c" stroke-width="2" marker-end="url(#arrow-remove)"></path>
    <text x="120" y="130" text-anchor="middle" font-size="12" fill="#b3467c">pop min</text>
    <rect x="40" y="155" width="60" height="44" rx="8" fill="#b3467c14" stroke="#b3467c" stroke-width="2"></rect>
    <text x="70" y="183" fill="#b3467c">3✕</text>

    <rect x="212" y="155" width="60" height="44" rx="8" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
    <text x="242" y="183" fill="#a8710a">5</text>
    <rect x="284" y="155" width="60" height="44" rx="8" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
    <text x="314" y="183" fill="#a8710a">4</text>
    <rect x="356" y="155" width="60" height="44" rx="8" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
    <text x="386" y="183" fill="#a8710a">7</text>
  </g>

  <text x="32" y="560" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">7 beats the current minimum (3), so it earns a spot and 3 gets evicted. The heap</text>
  <text x="32" y="578" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">never grows past size K.</text>

  <text x="32" y="618" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">FIVE VARIANTS</text>
  <text x="32" y="644" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One eviction shape, five definitions of "worst"</text>

  <!-- CARD 1 -->
  <g transform="translate(32,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-kth-largest-heap.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Fixed-size min-heap</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="60" y="70" width="50" height="40" rx="7" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="85" y="94" fill="#a8710a">4</text>
      <rect x="120" y="70" width="50" height="40" rx="7" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="145" y="94" fill="#a8710a">5</text>
      <rect x="180" y="70" width="50" height="40" rx="7" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="205" y="94" fill="#a8710a">6</text>
      <text x="145" y="55" text-anchor="middle" fill="#4a5a70">heap holds the top 3</text>
      <text x="145" y="140" text-anchor="middle" fill="#a8710a">heap top (min = 4) = 2nd largest of 6 values</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Once the heap holds K elements,</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">its minimum IS the Kth largest —</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">no sorting required.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-top-k-frequent.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Same heap, keyed by a derived count</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle">
      <text x="80" y="50" fill="#14202e">1 → count 3</text>
      <text x="80" y="72" fill="#14202e">2 → count 2</text>
      <text x="80" y="94" fill="#14202e">3 → count 1</text>
      <path d="M150,72 L200,72" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
      <text x="250" y="50" fill="#a8710a">heap by count</text>
      <text x="250" y="72" fill="#a8710a">keeps {1, 2}</text>
      <text x="250" y="94" fill="#b3467c">evicts 3 (count 1)</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Count first with a plain Map, then</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">run the same eviction loop keyed</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">on the count instead of the value.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-k-closest-points.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Same heap, direction flipped to max</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle">
      <circle cx="160" cy="90" r="4" fill="#14202e"></circle>
      <text x="160" y="115" fill="#4a5a70">origin</text>
      <circle cx="100" cy="60" r="5" fill="#a8710a"></circle>
      <text x="90" y="50" fill="#a8710a">close: kept</text>
      <circle cx="240" cy="40" r="5" fill="#b3467c"></circle>
      <text x="250" y="30" fill="#b3467c">far: evicted</text>
      <text x="160" y="160" text-anchor="middle" fill="#4a5a70">max-heap top = farthest = worst</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">"Worst" is now the largest</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">distance — swap the comparator,</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">keep the rest identical.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-kth-largest-stream.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Persistent heap across calls</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle">
      <line x1="30" y1="90" x2="290" y2="90" stroke="#d7dee8" stroke-width="1.4" marker-end="url(#arrow-ink)"></line>
      <circle cx="70" cy="90" r="5" fill="#a8710a"></circle>
      <text x="70" y="70" fill="#4a5a70">add(3)</text>
      <circle cx="150" cy="90" r="5" fill="#a8710a"></circle>
      <text x="150" y="70" fill="#4a5a70">add(5)</text>
      <circle cx="230" cy="90" r="5" fill="#a8710a"></circle>
      <text x="230" y="70" fill="#4a5a70">add(10)</text>
      <text x="160" y="130" text-anchor="middle" fill="#a8710a">same heap instance, growing over time</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">The heap is a class field, not a</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">local variable — it remembers</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">everything between calls.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-top-k-frequent-words.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Same heap, two-part comparator</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="100" y="60" fill="#14202e">"love" (freq 2)</text>
      <text x="100" y="85" fill="#14202e">"i" (freq 2)</text>
      <text x="230" y="72" text-anchor="middle" fill="#4a5a70">tie on frequency</text>
      <text x="160" y="130" text-anchor="middle" fill="#b3467c">"love" &gt; "i" alphabetically → evicted first if oversized</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Same frequency isn't a tie for</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">the heap — the comparator's</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">second rule decides who goes first.</text>
  </g>

  <text x="32" y="1320" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/14-top-k-elements/ — README.md · problems.md · 01–05*.js</text>
</svg>
