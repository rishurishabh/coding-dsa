<svg width="1040" height="1380" viewBox="0 0 1040 1380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Unbounded Knapsack mechanism map: capacity looped upward so items can repeat, and five variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1380" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Unbounded Knapsack — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 20-UNBOUNDED-KNAPSACK</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Capacity is looped UPWARD, not downward — so dp[c - weight] may already include</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">this same item, which is exactly what allows unlimited reuse.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">exclude — unchanged</text>
  <rect x="230" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="252" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">include — may already include this item</text>
  <rect x="530" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="552" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">result cell</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">dp[c] = better of exclude vs include (ascending loop)</text>

  <rect x="32" y="266" width="976" height="250" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,306)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <path d="M161,70 L599,70" fill="none" stroke="#4a5a70" stroke-width="1.4" marker-end="url(#arrow-ink)"></path>
    <text x="380" y="60" text-anchor="middle" font-size="11" fill="#4a5a70">capacity loop: c = weight → capacity, ascending</text>
    <rect x="161" y="90" width="54" height="40" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <rect x="225" y="90" width="54" height="40" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <rect x="289" y="90" width="54" height="40" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <rect x="353" y="90" width="54" height="40" rx="7" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2"></rect>
    <text x="380" y="115" fill="#0f7a72">dp[3]</text>
    <rect x="417" y="90" width="54" height="40" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <rect x="481" y="90" width="54" height="40" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></rect>
    <rect x="545" y="90" width="54" height="40" rx="7" fill="#a8710a14" stroke="#a8710a" stroke-width="2.4"></rect>
    <text x="572" y="115" fill="#a8710a">dp[6]</text>
    <path d="M572,88 Q572,50 545,50 Q520,50 520,88" fill="none" stroke="#b3467c" stroke-width="1.8" marker-end="url(#arrow-remove)"></path>
    <text x="545" y="35" text-anchor="middle" font-size="12" fill="#b3467c">exclude: keep dp[6]</text>
    <path d="M380,133 Q460,175 560,133" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
    <text x="470" y="192" text-anchor="middle" font-size="12" fill="#0f7a72">include: dp[3] + value (weight = 3)</text>
    <text x="572" y="165" text-anchor="middle" font-size="12" fill="#a8710a">dp[6] = max(exclude, include)</text>
  </g>

  <text x="32" y="560" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">Because capacity climbs 3 → 6 in the SAME pass over this item, dp[3] read by "include"</text>
  <text x="32" y="578" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">may itself already reflect this item — 0/1 knapsack loops down precisely to prevent that.</text>

  <text x="32" y="628" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">FIVE VARIANTS</text>
  <text x="32" y="654" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One direction flip, read as a max, a min, or a count</text>

  <!-- CARD 1 -->
  <g transform="translate(32,674)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-unbounded-knapsack-max-value.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Include-or-exclude, items reusable</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="60" y="60" width="80" height="40" rx="7" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></rect>
      <text x="100" y="85" fill="#a8710a">w=5, v=7</text>
      <rect x="180" y="60" width="80" height="40" rx="7" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></rect>
      <text x="220" y="85" fill="#0f7a72">w=3, v=4</text>
      <text x="160" y="130" text-anchor="middle" fill="#a8710a">capacity 8: one of each → value 11</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Same question as 0/1 knapsack —</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">does including this item beat</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">excluding it — but reusably.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,674)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-coin-change-min-coins.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Same recurrence, minimize count</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="70" fill="#14202e">dp[6] = min(dp[6], dp[3] + 1)</text>
      <text x="160" y="100" fill="#a8710a">coins 3, 3 → amount 6 in 2 coins</text>
      <text x="160" y="140" text-anchor="middle" fill="#4a5a70">Infinity means "not yet reachable"</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Max becomes min, +value becomes</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">+1 — same ascending shape, a</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">different combining operator.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,674)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-coin-change-count-combinations.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Counting, coins outer loop</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="60" fill="#14202e">for coin of coins:</text>
      <text x="160" y="82" fill="#0f7a72">  for a = coin..amount:</text>
      <path d="M160,92 L160,110" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="160" y="130" fill="#a8710a">each combo counted once</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Coin type fixed before amount</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">varies — {1,1,3} only ever built</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">one way, order ignored.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,998)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-combination-sum-count-permutations.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Counting, amount outer loop</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <text x="160" y="60" fill="#14202e">for a = 1..target:</text>
      <text x="160" y="82" fill="#0f7a72">  for num of nums:</text>
      <path d="M160,92 L160,110" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
      <text x="160" y="130" fill="#a8710a">1,3 and 3,1 both counted</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Identical code to variant 3 with</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">the two loops swapped — loop</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">order alone changes the meaning.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,998)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-word-break.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Boolean reachability, string domain</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="40" y="80" width="40" height="34" rx="6" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <text x="60" y="102" fill="#0f7a72">T</text>
      <rect x="86" y="80" width="40" height="34" rx="6" fill="none" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="106" y="102" fill="#4a5a70">F</text>
      <rect x="132" y="80" width="40" height="34" rx="6" fill="none" stroke="#d7dee8" stroke-width="1.4"></rect>
      <text x="152" y="102" fill="#4a5a70">F</text>
      <rect x="178" y="80" width="40" height="34" rx="6" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></rect>
      <text x="198" y="102" fill="#a8710a">T</text>
      <text x="130" y="65" text-anchor="middle" fill="#4a5a70">"leet" then "code" reaches i=8</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Words are variable-length coins —</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">dp[i] reachable if some word ends</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">exactly at i from a reachable start.</text>
  </g>

  <text x="32" y="1340" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/20-unbounded-knapsack/ — README.md · problems.md · 01–05*.js</text>
</svg>
