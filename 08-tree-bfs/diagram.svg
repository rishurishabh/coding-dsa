<svg width="1040" height="1400" viewBox="0 0 1040 1400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tree BFS mechanism map: the level-size snapshot loop, and six variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1400" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Tree BFS — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 08-TREE-BFS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">A queue alone gives breadth-first order. Snapshotting its size before draining a level is</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">what turns that into "process exactly this depth, then stop."</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">this level, draining now</text>
  <rect x="260" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="282" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">pushed for the next level</text>
  <rect x="480" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="502" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">result</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Snapshot the queue's size, then drain exactly that many</text>

  <rect x="32" y="266" width="976" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,296)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <line x1="380" y1="50" x2="280" y2="110" stroke="#d7dee8" stroke-width="1.6"></line>
    <line x1="380" y1="50" x2="480" y2="110" stroke="#d7dee8" stroke-width="1.6"></line>
    <line x1="480" y1="120" x2="430" y2="180" stroke="#d7dee8" stroke-width="1.6"></line>
    <line x1="480" y1="120" x2="530" y2="180" stroke="#d7dee8" stroke-width="1.6"></line>
    <circle cx="380" cy="40" r="20" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="380" y="45" fill="#14202e">3</text>
    <circle cx="280" cy="110" r="20" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.2"></circle>
    <text x="280" y="115" fill="#0f7a72">9</text>
    <circle cx="480" cy="110" r="20" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.2"></circle>
    <text x="480" y="115" fill="#0f7a72">20</text>
    <circle cx="430" cy="180" r="20" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></circle>
    <text x="430" y="185" fill="#b3467c">15</text>
    <circle cx="530" cy="180" r="20" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></circle>
    <text x="530" y="185" fill="#b3467c">7</text>
    <path d="M255,88 Q380,60 505,88" fill="none" stroke="#0f7a72" stroke-width="1.6" stroke-dasharray="4 3"></path>
    <text x="380" y="70" text-anchor="middle" font-size="12" fill="#0f7a72">size = 2 → drain exactly 2 this level</text>
    <text x="480" y="225" text-anchor="middle" font-size="12" fill="#b3467c">pushed while draining: belongs to the NEXT level</text>
  </g>

  <text x="32" y="600" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">9 and 20 are this level. While popping them, their children (15 and 7) get pushed — but the</text>
  <text x="32" y="618" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">size was snapshotted BEFORE that push, so they won't leak into the current level's count.</text>

  <text x="32" y="660" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">SIX VARIANTS</text>
  <text x="32" y="686" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">One snapshot trick, six different jobs</text>

  <!-- CARD 1 -->
  <g transform="translate(32,706)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-level-order-traversal.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Queue + level-size snapshot</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="35" x2="100" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="160" y1="35" x2="220" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="220" y1="90" x2="190" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="220" y1="90" x2="250" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <circle cx="160" cy="30" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <circle cx="100" cy="80" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <circle cx="220" cy="80" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <circle cx="190" cy="135" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <circle cx="250" cy="135" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <rect x="135" y="10" width="50" height="40" rx="10" fill="none" stroke="#a8710a" stroke-width="1.6" stroke-dasharray="3 2"></rect>
      <rect x="75" y="60" width="170" height="40" rx="10" fill="none" stroke="#a8710a" stroke-width="1.6" stroke-dasharray="3 2"></rect>
      <rect x="165" y="115" width="105" height="40" rx="10" fill="none" stroke="#a8710a" stroke-width="1.6" stroke-dasharray="3 2"></rect>
      <text x="160" y="175" text-anchor="middle" fill="#a8710a">[[3],[9,20],[15,7]]</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Each level's drain loop produces</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">exactly one array — the foundation</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">every other variant builds on.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,706)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-level-order-sentinel.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Queue + sentinel marker</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="30" y="80" width="36" height="32" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <rect x="72" y="80" width="36" height="32" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <polygon points="140,76 160,96 140,116 120,96" fill="#a8710a14" stroke="#a8710a" stroke-width="1.8"></polygon>
      <rect x="180" y="80" width="36" height="32" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="1.6"></rect>
      <rect x="222" y="80" width="36" height="32" rx="5" fill="#b3467c14" stroke="#b3467c" stroke-width="1.6"></rect>
      <text x="48" y="100" fill="#0f7a72">9</text>
      <text x="90" y="100" fill="#0f7a72">20</text>
      <text x="140" y="100" fill="#a8710a">•</text>
      <text x="198" y="100" fill="#b3467c">15</text>
      <text x="240" y="100" fill="#b3467c">7</text>
      <text x="140" y="140" text-anchor="middle" fill="#a8710a">pop the marker → level done, re-enqueue it</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">No size math — popping the</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">marker itself IS the level</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">boundary.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,706)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-zigzag-level-order.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Snapshot + direction toggle</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="35" x2="100" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="160" y1="35" x2="220" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <circle cx="160" cy="30" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="160" y="34" fill="#14202e">3</text>
      <circle cx="100" cy="80" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="100" y="84" fill="#14202e">9</text>
      <circle cx="220" cy="80" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="220" y="84" fill="#14202e">20</text>
      <path d="M100,105 Q160,130 220,105" fill="none" stroke="#0f7a72" stroke-width="1.8" marker-end="url(#arrow-add)"></path>
      <text x="160" y="150" text-anchor="middle" fill="#0f7a72">discovered left→right, RECORDED reversed</text>
      <text x="160" y="170" text-anchor="middle" fill="#a8710a">level 2 → [20, 9]</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">The queue order never changes —</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">only whether the finished level</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">array gets reversed before saving.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,1030)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-right-side-view.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Snapshot, keep one node</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="35" x2="100" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="160" y1="35" x2="220" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="100" y1="90" x2="130" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="220" y1="90" x2="250" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <circle cx="160" cy="30" r="15" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></circle>
      <text x="160" y="34" fill="#a8710a">1</text>
      <circle cx="100" cy="80" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="100" y="84" fill="#14202e">2</text>
      <circle cx="220" cy="80" r="15" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></circle>
      <text x="220" y="84" fill="#a8710a">3</text>
      <circle cx="130" cy="135" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="130" y="139" fill="#14202e">5</text>
      <circle cx="250" cy="135" r="15" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></circle>
      <text x="250" y="139" fill="#a8710a">4</text>
      <text x="160" y="175" text-anchor="middle" fill="#a8710a">right side view: [1, 3, 4]</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">The last node popped in each</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">level's loop is provably the</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">rightmost — no need to keep the rest.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,1030)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-minimum-depth.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Snapshot + early exit</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="35" x2="100" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="160" y1="35" x2="220" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="220" y1="90" x2="190" y2="135" stroke="#d7dee8" stroke-width="1.2" stroke-dasharray="3 2"></line>
      <line x1="220" y1="90" x2="250" y2="135" stroke="#d7dee8" stroke-width="1.2" stroke-dasharray="3 2"></line>
      <circle cx="160" cy="30" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="160" y="34" fill="#14202e">3</text>
      <circle cx="100" cy="80" r="15" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></circle>
      <text x="100" y="84" fill="#a8710a">9</text>
      <circle cx="220" cy="80" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="220" y="84" fill="#14202e">20</text>
      <circle cx="190" cy="135" r="15" fill="none" stroke="#d7dee8" stroke-width="1.2" stroke-dasharray="3 2"></circle>
      <text x="190" y="139" fill="#4a5a70">15</text>
      <circle cx="250" cy="135" r="15" fill="none" stroke="#d7dee8" stroke-width="1.2" stroke-dasharray="3 2"></circle>
      <text x="250" y="139" fill="#4a5a70">7</text>
      <text x="160" y="175" text-anchor="middle" fill="#a8710a">leaf found at depth 2 — stop, never visit 15 or 7</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">9 is a leaf found at depth 2.</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">BFS returns immediately — 15 and 7</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">are never even dequeued.</text>
  </g>

  <!-- CARD 6 -->
  <g transform="translate(712,1030)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">06-connect-level-pointers.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Snapshot, mutate not collect</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="35" x2="100" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="160" y1="35" x2="220" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="100" y1="90" x2="70" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="100" y1="90" x2="130" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="220" y1="90" x2="190" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="220" y1="90" x2="250" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <circle cx="160" cy="30" r="14" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="160" y="34" fill="#14202e">1</text>
      <circle cx="100" cy="80" r="14" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="100" y="84" fill="#14202e">2</text>
      <circle cx="220" cy="80" r="14" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="220" y="84" fill="#14202e">3</text>
      <path d="M114,80 L206,80" fill="none" stroke="#0f7a72" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrow-add)"></path>
      <circle cx="70" cy="135" r="14" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="70" y="139" fill="#14202e">4</text>
      <circle cx="130" cy="135" r="14" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="130" y="139" fill="#14202e">5</text>
      <circle cx="190" cy="135" r="14" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="190" y="139" fill="#14202e">6</text>
      <circle cx="250" cy="135" r="14" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="250" y="139" fill="#14202e">7</text>
      <path d="M84,135 L116,135" fill="none" stroke="#0f7a72" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrow-add)"></path>
      <path d="M144,135 L176,135" fill="none" stroke="#0f7a72" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrow-add)"></path>
      <path d="M204,135 L236,135" fill="none" stroke="#0f7a72" stroke-width="1.6" stroke-dasharray="3 2" marker-end="url(#arrow-add)"></path>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">prev.next = node falls straight</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">out of the drain loop's pop order —</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">no output array needed at all.</text>
  </g>

  <text x="32" y="1360" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/08-tree-bfs/ — README.md · problems.md · 01–06*.js</text>
</svg>
