<svg width="1040" height="1180" viewBox="0 0 1040 1180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Heap fundamentals diagram: a max-heap tree with 9 at the root and a min-heap tree with 1 at the root, shown side by side, contrasted below with an unrelated memory layout of a call stack and a memory heap.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1180" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Heap Fundamentals — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / HEAP-FUNDAMENTALS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">One tree shape, one flipped comparison — and a second, unrelated "heap"</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">living in your program's memory, not in this diagram at all.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">root (the extreme value)</text>
  <rect x="250" y="146" width="14" height="14" rx="3" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
  <text x="272" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">node</text>
  <rect x="340" y="146" width="14" height="14" rx="3" fill="#b3467c14" stroke="#b3467c" stroke-width="1.4"></rect>
  <text x="362" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">unrelated to the trees</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE MOVE</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Same tree shape, one flipped rule</text>

  <rect x="32" y="266" width="976" height="290" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <text x="270" y="300" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#14202e">MAX-HEAP — parent ≥ children</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <path d="M270,338 L200,368" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>
    <path d="M270,338 L340,368" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>
    <path d="M200,388 L160,418" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>
    <path d="M200,388 L240,418" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>
    <path d="M340,388 L340,418" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>

    <rect x="248" y="316" width="44" height="36" rx="7" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.2"></rect>
    <text x="270" y="340" fill="#0f7a72">9</text>
    <rect x="178" y="368" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="200" y="392" fill="#4a5a70">5</text>
    <rect x="318" y="368" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="340" y="392" fill="#4a5a70">6</text>
    <rect x="138" y="418" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="160" y="442" fill="#4a5a70">1</text>
    <rect x="218" y="418" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="240" y="442" fill="#4a5a70">4</text>
    <rect x="318" y="418" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="340" y="442" fill="#4a5a70">2</text>
  </g>
  <text x="270" y="500" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a8710a">array: [9, 5, 6, 1, 4, 2]</text>

  <text x="740" y="300" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#14202e">MIN-HEAP — parent ≤ children</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" text-anchor="middle">
    <path d="M740,338 L670,368" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>
    <path d="M740,338 L810,368" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>
    <path d="M670,388 L630,418" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>
    <path d="M670,388 L710,418" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>
    <path d="M810,388 L810,418" fill="none" stroke="#4a5a70" stroke-width="1.6"></path>

    <rect x="718" y="316" width="44" height="36" rx="7" fill="#0f7a7214" stroke="#0f7a72" stroke-width="2.2"></rect>
    <text x="740" y="340" fill="#0f7a72">1</text>
    <rect x="648" y="368" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="670" y="392" fill="#4a5a70">3</text>
    <rect x="788" y="368" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="810" y="392" fill="#4a5a70">2</text>
    <rect x="608" y="418" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="630" y="442" fill="#4a5a70">8</text>
    <rect x="688" y="418" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="710" y="442" fill="#4a5a70">4</text>
    <rect x="788" y="418" width="44" height="36" rx="7" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></rect>
    <text x="810" y="442" fill="#4a5a70">9</text>
  </g>
  <text x="740" y="500" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a8710a">array: [1, 3, 2, 8, 4, 9]</text>

  <line x1="520" y1="290" x2="520" y2="526" stroke="#d7dee8" stroke-width="1"></line>
  <text x="32" y="540" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12.5" fill="#4a5a70">Building either one is the SAME algorithm with ONE comparison flipped — see 02-heapify-array.js.</text>

  <text x="32" y="600" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">A COMPLETELY DIFFERENT "HEAP"</text>
  <text x="32" y="626" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">The memory heap has nothing to do with the trees above</text>

  <rect x="32" y="644" width="976" height="190" rx="12" fill="#ffffff" stroke="#b3467c" stroke-width="1.6" stroke-dasharray="6,4"></rect>

  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <rect x="80" y="670" width="220" height="130" rx="8" fill="#4a5a7014" stroke="#4a5a70" stroke-width="1.6"></rect>
    <text x="190" y="696" font-weight="700" fill="#14202e">CALL STACK</text>
    <text x="190" y="724" font-size="11.5" fill="#4a5a70">local variables,</text>
    <text x="190" y="742" font-size="11.5" fill="#4a5a70">function calls</text>
    <text x="190" y="768" font-size="11.5" fill="#4a5a70">LIFO, strict order</text>

    <rect x="340" y="670" width="220" height="130" rx="8" fill="#b3467c14" stroke="#b3467c" stroke-width="2"></rect>
    <text x="450" y="696" font-weight="700" fill="#b3467c">MEMORY HEAP</text>
    <text x="450" y="724" font-size="11.5" fill="#b3467c">objects, arrays,</text>
    <text x="450" y="742" font-size="11.5" fill="#b3467c">dynamic allocation</text>
    <text x="450" y="768" font-size="11.5" fill="#b3467c">no imposed order</text>
  </g>

  <text x="620" y="700" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" fill="#14202e">Same word, unrelated concept:</text>
  <text x="620" y="722" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">"heapUsed" here is about WHERE data</text>
  <text x="620" y="740" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">lives in RAM. The max/min trees above</text>
  <text x="620" y="758" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">are about the ORDER of values inside</text>
  <text x="620" y="776" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="12" fill="#4a5a70">an array. See 03-nodejs-memory-heap-demo.js.</text>

  <text x="32" y="874" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THREE VARIANTS</text>
  <text x="32" y="900" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Check it, build it, then meet the other kind of heap</text>

  <!-- CARD 1 -->
  <g transform="translate(32,920)">
    <rect x="0" y="0" width="300" height="220" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-heap-property-check.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#14202e">Validate the property</text>
    <text x="16" y="90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#14202e">isMaxHeap / isMinHeap</text>
    <path d="M150,100 L150,118" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
    <text x="150" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a8710a">true / false</text>
    <text x="16" y="185" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Confirm an array is a heap,</text>
    <text x="16" y="201" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">or learn the index math.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(370,920)">
    <rect x="0" y="0" width="300" height="220" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-heapify-array.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#14202e">Build a heap from scratch</text>
    <text x="16" y="90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#14202e">siftDown, one flipped compare</text>
    <path d="M150,100 L150,118" fill="none" stroke="#a8710a" stroke-width="1.8" marker-end="url(#arrow-result)"></path>
    <text x="150" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a8710a">max-heap or min-heap</text>
    <text x="16" y="185" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Same algorithm, opposite</text>
    <text x="16" y="201" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">root, one line different.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(708,920)">
    <rect x="0" y="0" width="300" height="220" rx="12" fill="#ffffff" stroke="#b3467c" stroke-width="1.6"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-nodejs-memory-heap-demo.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#b3467c">The OTHER heap, for real</text>
    <text x="16" y="90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#14202e">process.memoryUsage()</text>
    <path d="M150,100 L150,118" fill="none" stroke="#b3467c" stroke-width="1.8"></path>
    <text x="150" y="140" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#b3467c">heapUsed / heapTotal (MB)</text>
    <text x="16" y="185" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Unrelated to max/min-heap —</text>
    <text x="16" y="201" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">proven with real numbers.</text>
  </g>

  <text x="32" y="1160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/heap-fundamentals/ — README.md · problems.md · 01–03*.js</text>
</svg>
