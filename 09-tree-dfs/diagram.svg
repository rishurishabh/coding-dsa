<svg width="1040" height="1680" viewBox="0 0 1040 1680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tree DFS mechanism map: top-down versus bottom-up recursion, and seven variant diagrams.">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a70"></path></marker>
    <marker id="arrow-add" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f7a72"></path></marker>
    <marker id="arrow-remove" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3467c"></path></marker>
    <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a8710a"></path></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="1680" fill="#eef2f7"></rect>

  <text x="32" y="60" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="700" fill="#14202e">Tree DFS — Mechanism Map</text>
  <text x="32" y="84" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1" fill="#4a5a70">COMPANION TO CODING_DSA / 09-TREE-DFS</text>
  <text x="32" y="110" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">Two shapes hide under one name. Top-down hands state to children as arguments;</text>
  <text x="32" y="128" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13.5" fill="#4a5a70">bottom-up builds state from what children return.</text>

  <rect x="32" y="146" width="14" height="14" rx="3" fill="#0f7a72"></rect>
  <text x="54" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">top-down / state passed down</text>
  <rect x="290" y="146" width="14" height="14" rx="3" fill="#b3467c"></rect>
  <text x="312" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">bottom-up / state returned up</text>
  <rect x="550" y="146" width="14" height="14" rx="3" fill="#a8710a"></rect>
  <text x="572" y="157" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#4a5a70">result / side-channel answer</text>

  <line x1="32" y1="188" x2="1008" y2="188" stroke="#d7dee8" stroke-width="1"></line>

  <text x="32" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">THE CORE SPLIT</text>
  <text x="32" y="248" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Top-down vs. bottom-up</text>

  <rect x="32" y="266" width="976" height="260" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>

  <g transform="translate(140,286)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
    <text x="180" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#0f7a72">TOP-DOWN</text>
    <line x1="180" y1="55" x2="120" y2="110" stroke="#0f7a72" stroke-width="2" marker-end="url(#arrow-add)"></line>
    <line x1="180" y1="55" x2="240" y2="110" stroke="#0f7a72" stroke-width="2" marker-end="url(#arrow-add)"></line>
    <circle cx="180" cy="40" r="18" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="180" y="45" fill="#14202e">•</text>
    <circle cx="120" cy="120" r="18" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="120" y="125" fill="#14202e">•</text>
    <circle cx="240" cy="120" r="18" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="240" y="125" fill="#14202e">•</text>
    <text x="180" y="175" text-anchor="middle" font-size="11" fill="#0f7a72">argument carries state down</text>

    <text x="580" y="26" text-anchor="middle" font-size="13" font-weight="700" fill="#b3467c">BOTTOM-UP</text>
    <line x1="520" y1="112" x2="580" y2="57" stroke="#b3467c" stroke-width="2" marker-end="url(#arrow-remove)"></line>
    <line x1="640" y1="112" x2="580" y2="57" stroke="#b3467c" stroke-width="2" marker-end="url(#arrow-remove)"></line>
    <circle cx="580" cy="40" r="18" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="580" y="45" fill="#14202e">•</text>
    <circle cx="520" cy="120" r="18" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="520" y="125" fill="#14202e">•</text>
    <circle cx="640" cy="120" r="18" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
    <text x="640" y="125" fill="#14202e">•</text>
    <text x="580" y="175" text-anchor="middle" font-size="11" fill="#b3467c">return value carries state up</text>
  </g>

  <text x="32" y="560" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">Top-down: a node decides using only what its parent handed it. Bottom-up: a node</text>
  <text x="32" y="578" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="13" fill="#4a5a70">can't decide anything until both children have already answered.</text>

  <text x="32" y="618" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4a5a70">SEVEN VARIANTS</text>
  <text x="32" y="644" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#14202e">Three top-down, three bottom-up, one foundation</text>

  <!-- CARD 1 -->
  <g transform="translate(32,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">01-traversal-orders.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Recursive descent, three orders</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="120" y1="45" x2="200" y2="90" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="200" y1="100" x2="160" y2="140" stroke="#d7dee8" stroke-width="1.4"></line>
      <circle cx="120" cy="40" r="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="120" y="44" fill="#14202e">1</text>
      <circle cx="200" cy="95" r="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="200" y="99" fill="#14202e">2</text>
      <circle cx="160" cy="145" r="16" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="160" y="149" fill="#14202e">3</text>
      <text x="160" y="175" text-anchor="middle" fill="#a8710a">pre [1,2,3] · in [1,3,2] · post [3,2,1]</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Same three recursive calls,</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">self/left/right reordered — three</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">different sequences fall out.</text>
  </g>

  <!-- CARD 2 -->
  <g transform="translate(372,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">02-path-sum-target.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Top-down, accumulate down</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="35" x2="160" y2="90" stroke="#0f7a72" stroke-width="2"></line>
      <line x1="160" y1="100" x2="160" y2="145" stroke="#0f7a72" stroke-width="2"></line>
      <circle cx="160" cy="30" r="17" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></circle>
      <text x="160" y="34" fill="#0f7a72">5</text>
      <circle cx="160" cy="95" r="17" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.8"></circle>
      <text x="160" y="99" fill="#0f7a72">4</text>
      <circle cx="160" cy="150" r="17" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></circle>
      <text x="160" y="154" fill="#a8710a">2</text>
      <text x="230" y="30" fill="#0f7a72">target=11</text>
      <text x="230" y="95" fill="#0f7a72">remaining=6</text>
      <text x="230" y="150" fill="#a8710a">leaf: 2==2 ✓</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">The remaining target shrinks by</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">node.val on the way down — the</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">leaf just compares against itself.</text>
  </g>

  <!-- CARD 3 -->
  <g transform="translate(712,664)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">03-all-paths-with-backtrack.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Top-down + explicit backtrack</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect x="30" y="60" width="34" height="30" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <rect x="68" y="60" width="34" height="30" rx="5" fill="#0f7a7214" stroke="#0f7a72" stroke-width="1.6"></rect>
      <rect x="106" y="60" width="34" height="30" rx="5" fill="#a8710a14" stroke="#a8710a" stroke-width="2"></rect>
      <text x="47" y="80" fill="#0f7a72">5</text>
      <text x="85" y="80" fill="#0f7a72">4</text>
      <text x="123" y="80" fill="#a8710a">11</text>
      <path d="M85,50 Q85,20 47,20" fill="none" stroke="#0f7a72" stroke-width="1.6" marker-end="url(#arrow-add)"></path>
      <text x="60" y="14" fill="#0f7a72">push on the way down</text>
      <path d="M85,100 Q85,130 47,130" fill="none" stroke="#b3467c" stroke-width="1.6" marker-end="url(#arrow-remove)"></path>
      <text x="60" y="150" fill="#b3467c">pop on the way back up</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">One shared array, mutated and</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">un-mutated — cheap, but only if</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">every push has a matching pop.</text>
  </g>

  <!-- CARD 4 -->
  <g transform="translate(32,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">04-validate-bst-range.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Top-down, shrink a constraint</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <line x1="160" y1="35" x2="100" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="160" y1="35" x2="220" y2="80" stroke="#d7dee8" stroke-width="1.4"></line>
      <line x1="220" y1="90" x2="190" y2="135" stroke="#d7dee8" stroke-width="1.4"></line>
      <circle cx="160" cy="30" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="160" y="34" fill="#14202e">5</text>
      <text x="160" y="12" fill="#4a5a70">(−∞, ∞)</text>
      <circle cx="100" cy="80" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="100" y="84" fill="#14202e">1</text>
      <circle cx="220" cy="80" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="220" y="84" fill="#14202e">4</text>
      <text x="220" y="65" fill="#4a5a70">(5, ∞)</text>
      <circle cx="190" cy="135" r="15" fill="#b3467c14" stroke="#b3467c" stroke-width="2.2"></circle>
      <text x="190" y="139" fill="#b3467c">3</text>
      <text x="150" y="160" fill="#b3467c">3 &lt; 5: fails ancestor's range</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">3 looks fine next to parent 4,</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">but the range from grandparent 5</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">already ruled it out.</text>
  </g>

  <!-- CARD 5 -->
  <g transform="translate(372,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">05-diameter-of-tree.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Bottom-up + side channel</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="45" x2="100" y2="90" stroke="#b3467c" stroke-width="1.8"></line>
      <line x1="160" y1="45" x2="220" y2="90" stroke="#b3467c" stroke-width="1.8"></line>
      <circle cx="160" cy="35" r="17" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
      <text x="160" y="39" fill="#14202e">•</text>
      <circle cx="100" cy="100" r="15" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></circle>
      <text x="100" y="104" fill="#b3467c">h=2</text>
      <circle cx="220" cy="100" r="15" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></circle>
      <text x="220" y="104" fill="#b3467c">h=1</text>
      <text x="160" y="20" fill="#0f7a72">returns: 1+max(2,1)=3</text>
      <text x="160" y="150" text-anchor="middle" fill="#a8710a">side channel: diameter = max(2+1, prev best)</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Height is what the parent needs</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">back. Diameter-through-this-node</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">is only knowable here.</text>
  </g>

  <!-- CARD 6 -->
  <g transform="translate(712,988)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">06-max-path-sum.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Bottom-up + side channel + clamp</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="45" x2="100" y2="90" stroke="#d7dee8" stroke-width="1.4" stroke-dasharray="3 2"></line>
      <line x1="160" y1="45" x2="220" y2="90" stroke="#b3467c" stroke-width="1.8"></line>
      <circle cx="160" cy="35" r="17" fill="#ffffff" stroke="#d7dee8" stroke-width="1.6"></circle>
      <text x="160" y="39" fill="#14202e">•</text>
      <circle cx="100" cy="100" r="15" fill="none" stroke="#d7dee8" stroke-width="1.4" stroke-dasharray="3 2"></circle>
      <text x="100" y="104" fill="#4a5a70">−7 → 0</text>
      <circle cx="220" cy="100" r="15" fill="#b3467c14" stroke="#b3467c" stroke-width="1.8"></circle>
      <text x="220" y="104" fill="#b3467c">+9</text>
      <text x="160" y="150" text-anchor="middle" fill="#a8710a">through-node = val + 0 + 9 (skip negative branch)</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">A branch that only subtracts gets</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">clamped to 0 — opting out beats</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">including it, on both values.</text>
  </g>

  <!-- CARD 7 -->
  <g transform="translate(32,1312)">
    <rect x="0" y="0" width="320" height="300" rx="12" fill="#ffffff" stroke="#d7dee8" stroke-width="1.5"></rect>
    <text x="16" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4a5a70">07-lowest-common-ancestor.js</text>
    <text x="16" y="44" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" font-weight="700" fill="#14202e">Bottom-up search</text>
    <g transform="translate(16,56) scale(0.9)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <line x1="160" y1="45" x2="100" y2="90" stroke="#b3467c" stroke-width="1.8" marker-end="url(#arrow-remove)"></line>
      <line x1="160" y1="45" x2="220" y2="90" stroke="#b3467c" stroke-width="1.8" marker-end="url(#arrow-remove)"></line>
      <circle cx="160" cy="35" r="17" fill="#a8710a14" stroke="#a8710a" stroke-width="2.2"></circle>
      <text x="160" y="39" fill="#a8710a">•</text>
      <circle cx="100" cy="100" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="100" y="104" fill="#14202e">p</text>
      <circle cx="220" cy="100" r="15" fill="#ffffff" stroke="#d7dee8" stroke-width="1.4"></circle>
      <text x="220" y="104" fill="#14202e">q</text>
      <text x="160" y="150" text-anchor="middle" fill="#a8710a">both sides return non-null → this node is the LCA</text>
    </g>
    <text x="16" y="235" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">Neither subtree alone can report</text>
    <text x="16" y="251" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">the answer — only the node where</text>
    <text x="16" y="267" font-family="-apple-system, Segoe UI, Arial, sans-serif" font-size="11.5" fill="#4a5a70">both searches converge knows.</text>
  </g>

  <text x="32" y="1650" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#4a5a70">coding_dsa/09-tree-dfs/ — README.md · problems.md · 01–07*.js</text>
</svg>
